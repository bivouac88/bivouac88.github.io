<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Carte des POI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #carte { height: 100%; }
  #etat {
    position: absolute; z-index: 1000; left: 50%; top: 10px; transform: translateX(-50%);
    background: #fff; color: #1f2a2e; padding: 6px 14px; border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 14px; max-width: 90%; text-align: center;
  }
  .popup-nom { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .popup-ligne { font-size: 13px; color: #444; margin: 2px 0; }
</style>
</head>
<body>
<div id="etat">Chargement…</div>
<div id="carte"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const DOSSIER = 'poi/';
  const ZOOM_MIN = 8;            // en dessous, on n'affiche rien (carte trop large)
  const COULEURS = ['#c0392b', '#2471a3', '#1e8449', '#b9770e', '#7d3c98', '#117a8b', '#873600', '#4d5656'];

  const carte = L.map('carte', { preferCanvas: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(carte);

  const etat = document.getElementById('etat');
  const couche = L.layerGroup().addTo(carte);
  const rendu = L.canvas({ padding: 0.5 });
  const dejaCharges = {};        // id du carré -> true (ou promesse en cours)
  const couleurs = {};
  let carres = [];

  function echapper(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function couleurDe(type) {
    const cle = String(type || '');
    if (!couleurs[cle]) couleurs[cle] = COULEURS[Object.keys(couleurs).length % COULEURS.length];
    return couleurs[cle];
  }

  // Ordre des colonnes : Nom, Groupes, Type_trad, latitude, longitude, ID
  function ajouterPoints(lignes) {
    lignes.forEach(function (l) {
      const marqueur = L.circleMarker([l[3], l[4]], {
        renderer: rendu, radius: 5, weight: 1, color: '#fff',
        fillColor: couleurDe(l[2]), fillOpacity: 0.9
      });
      let html = '<div class="popup-nom">' + echapper(l[0]) + '</div>';
      if (l[2]) html += '<div class="popup-ligne">' + echapper(l[2]) + '</div>';
      if (l[1]) html += '<div class="popup-ligne">' + echapper(l[1]) + '</div>';
      html += '<div class="popup-ligne">ID ' + echapper(l[5]) + '</div>';
      marqueur.bindPopup(html);
      couche.addLayer(marqueur);
    });
  }

  function chargerCarre(c) {
    if (dejaCharges[c.id]) return dejaCharges[c.id];
    dejaCharges[c.id] = fetch(DOSSIER + c.id + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (lignes) { ajouterPoints(lignes); return lignes.length; })
      .catch(function () { delete dejaCharges[c.id]; return 0; });
    return dejaCharges[c.id];
  }

  function majEtat() {
    let total = 0;
    carres.forEach(function (c) { if (dejaCharges[c.id] === true) total += c.n; });
    etat.textContent = total.toLocaleString('fr-FR') + ' points chargés';
  }

  function actualiser() {
    if (carte.getZoom() < ZOOM_MIN) {
      etat.textContent = 'Zoome pour afficher les points';
      return;
    }
    const vue = carte.getBounds();
    const visibles = carres.filter(function (c) {
      return c.lat < vue.getNorth() && c.lat + 0.5 > vue.getSouth() &&
             c.lon < vue.getEast() && c.lon + 0.5 > vue.getWest();
    });
    const aCharger = visibles.filter(function (c) { return !dejaCharges[c.id]; });
    if (!aCharger.length) { majEtat(); return; }
    etat.textContent = 'Chargement de ' + aCharger.length + ' carré(s)…';
    Promise.all(aCharger.map(function (c) {
      return chargerCarre(c).then(function (n) { if (n > 0) dejaCharges[c.id] = true; });
    })).then(majEtat);
  }

  fetch(DOSSIER + 'carres.json')
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function (liste) {
      carres = liste;
      if (!carres.length) { etat.textContent = 'Aucun carré dans carres.json'; carte.setView([46.5, 2.5], 6); return; }
      const sud = Math.min.apply(null, carres.map(function (c) { return c.lat; }));
      const nord = Math.max.apply(null, carres.map(function (c) { return c.lat + 0.5; }));
      const ouest = Math.min.apply(null, carres.map(function (c) { return c.lon; }));
      const est = Math.max.apply(null, carres.map(function (c) { return c.lon + 0.5; }));
      carte.fitBounds([[sud, ouest], [nord, est]]);
      carte.on('moveend', actualiser);
      actualiser();
    })
    .catch(function () {
      etat.textContent = 'Impossible de lire poi/carres.json';
      carte.setView([46.5, 2.5], 6);
    });
})();
</script>
</body>
</html>
