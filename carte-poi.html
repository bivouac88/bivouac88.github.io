<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- CSP : mêmes règles que l'accueil, plus cdnjs (Leaflet et markercluster). Si Leaflet est un jour copié dans le dossier, retirer cdnjs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdnjs.cloudflare.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<title>Bivouac88 • Points d'Intérêt</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e58e26">
<script src="commun.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
:root { --largeur: 1700px; }
main { padding-bottom: 80px; }
@media (min-width: 768px) { main { padding: 14px 20px 8px; } }
@media (max-width: 600px) { main { padding: 14px 12px 64px; } }

/* En-tête : identique à l'accueil */
.ligne-haut { display: block; padding-right: 0; margin-bottom: 0; }
.marque { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 12px; padding-right: 52px; }
.marque small { font: 400 12px var(--mono); color: var(--discret); letter-spacing: .04em; margin-left: 6px; white-space: nowrap; }
@media (min-width: 900px) {
  .ligne-haut { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 12px; padding-right: 52px; min-height: 56px; }
  .ligne-haut .marque { margin-bottom: 0; padding-right: 0; flex-shrink: 0; }
  .bouton-theme { top: 18px; }
}
@media (max-width: 600px) {
  .marque small { white-space: normal; flex: 1 1 100%; margin-left: 0; }
  .bouton-theme { top: 14px; right: 12px; }
}
.pied { margin-top: 14px; padding-bottom: 6px; }
.pied a { color: inherit; text-decoration: none; }

.intro { margin: 0 0 12px; font: 400 12px var(--mono); color: var(--discret); line-height: 1.5; }
.erreur { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--trait); border-radius: 10px; color: var(--discret); font: 400 12px var(--mono); }

/* Disposition */
#app { display: flex; gap: 12px; }
#panneau {
  width: 310px; flex: none; height: 76vh; min-height: 420px; display: flex; flex-direction: column;
  background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 10px;
}

/* Fallback si pas de rangee-recherche (ancien HTML) */
.rangee input[type=search] {
  flex: 1; min-width: 0; padding: 6px 8px;
  background: var(--fond); color: var(--papier);
  border: 1px solid var(--trait); border-radius: 8px;
  font: 400 12px var(--mono);
}
.rangee input[type=search]::placeholder { color: var(--discret); }
.rangee input[type=search]:focus { border-color: var(--accent-trait); outline: none; }

.rangee { display: flex; gap: 6px; margin: 2px 0 4px; }
.rangee button {
  flex: 1; padding: 5px; font: 500 11px var(--mono); letter-spacing: 0.04em;
  color: var(--papier-doux); background: none;
  border: 1px solid var(--trait); border-radius: 8px; cursor: pointer;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.rangee button:hover { color: var(--accent); border-color: var(--accent-trait); background: var(--carte-hover); }
.rangee button:focus-visible, .btn-plein:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#titre-liste { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--discret); margin: 4px 0 3px; }
#liste { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
#liste li { margin: 0; }
#liste label {
  display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 6px;
  cursor: pointer; font-size: 14px; color: var(--papier);
}
#liste label:hover { background: var(--carte-hover); }
#liste input[type=checkbox] { accent-color: var(--accent); }
.nom-cat { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb-cat { color: var(--discret); font: 400 12px var(--mono); font-variant-numeric: tabular-nums; }

.pin-wrap { background: none; border: 0; }
.pin {
  display: flex; align-items: center; justify-content: center; flex: none;
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff;
  font-size: 13px; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.55);
}

/* Carte */
#cadre {
  position: relative; flex: 1; min-width: 0; height: 76vh; min-height: 420px;
  border: 1px solid var(--trait); border-radius: 14px; overflow: hidden;
  background: var(--fond-carte-leaflet);
}
#carte { position: absolute; inset: 0; background: var(--fond-carte-leaflet); z-index: 1; }
.leaflet-tile-pane { filter: var(--filtre-tuiles); transition: filter .3s ease; }
.leaflet-container { background: var(--fond-carte-leaflet); font-family: var(--mono); }

#etat {
  position: absolute; z-index: 1000; left: 50%; top: 10px; transform: translateX(-50%);
  background: var(--carte); color: var(--papier);
  border: 1px solid var(--trait); padding: 6px 14px; border-radius: 8px;
  font: 400 12px var(--mono); max-width: 85%; text-align: center; pointer-events: none;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
}
.btn-plein {
  background: var(--carte); color: var(--papier-doux);
  border: 1px solid var(--trait); border-radius: 8px;
  padding: 7px 11px; font: 500 12px var(--mono); cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.2);
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.btn-plein:hover { background: var(--carte-hover); border-color: var(--accent); color: var(--papier); }

/* Éléments Leaflet aux couleurs du site */
.leaflet-popup-content-wrapper, .leaflet-popup-tip {
  background: var(--carte); color: var(--papier); border: 1px solid var(--trait);
  font-family: var(--mono); font-size: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.2);
}
.leaflet-popup-content-wrapper { border-radius: 8px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--discret); }
.leaflet-bar a { background: var(--carte); color: var(--papier); border-bottom-color: var(--trait); }
.leaflet-bar a:hover { background: var(--carte-hover); color: var(--accent); }
.leaflet-bar { border: 1px solid var(--trait); box-shadow: none; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--fond) 75%, transparent) !important; color: var(--discret); }
.leaflet-control-attribution a { color: var(--discret); }
.popup-nom { font: 600 14px var(--serif); margin-bottom: 4px; }
.popup-ligne { font: 400 12px var(--mono); color: var(--papier-doux); margin: 2px 0; }
.leaflet-container a.popup-go {
  display: inline-block; margin-left: 6px; padding: 2px 10px;
  background: var(--accent); color: #111; border-radius: 6px;
  font: 600 12px var(--mono); text-decoration: none; cursor: pointer;
}
.leaflet-container a.popup-go:hover { filter: brightness(1.12); }
.leaflet-container a.popup-go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Grappes aux couleurs du site */
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
  background: color-mix(in srgb, var(--accent) 90%, transparent); color: #111; font: 600 12px var(--mono);
}
@media (max-width: 800px) {
  #app { flex-direction: column; }
  #panneau { width: 100%; height: 40vh; height: 40dvh; min-height: 260px; flex: none; }
  #cadre { flex: none; height: 65vh; height: 65dvh; min-height: 320px; }
}
  #cadre.plein { position: fixed; inset: 0; z-index: 9999; height: 100%; min-height: 0; border-radius: 0; border: 0; }
</style>
</head>
<body>
<main data-credit="Données : OpenStreetMap">
<h1 class="sr-only">Bivouac88 · Points d'Intérêt</h1>
<noscript><p class="erreur" style="display:block">JavaScript est nécessaire pour afficher la carte.</p></noscript>
<button id="btn-theme" class="bouton-theme" type="button" aria-label="Changer de thème" title="Thème"></button>
<div class="ligne-haut"><div id="entete-site"></div></div>
<div id="statut" class="intro" role="status" aria-live="polite">Chargement des données…</div>

<div id="app">
  <aside id="panneau" aria-label="Filtres">
  <div class="rangee">
    <input type="search" id="rech-lieu" placeholder="Lieu…" aria-label="Rechercher un lieu par nom">
    <button type="button" id="tout-toggle">✓ Tout</button>
  </div>
  <div class="rangee">
    <button type="button" id="tri-az">A → Z</button>
    <button type="button" id="tri-nb">9 → 1</button>
  </div>
  <div id="titre-liste">Catégories</div>
  <ul id="liste"></ul>
</aside>
  <div id="cadre">
    <div id="etat">Chargement…</div>
    <div id="carte" role="region" aria-label="Carte des points d'intérêt"></div>
  </div>
</div>
<!-- Le pied de page est ajouté par commun.js -->
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
(function () {
  const DOSSIER = 'poi/';
  const SANS_TYPE = '(Sans type)';

  const carte = L.map('carte', { preferCanvas: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
  }).addTo(carte);

  const cadre = document.getElementById('cadre');
  // Recalcule la carte à chaque changement de taille (rotation, redimensionnement, plein écran, barre d'adresse...)
if (window.ResizeObserver) {
new ResizeObserver(function () { carte.invalidateSize(); }).observe(cadre);
}
  const etat = document.getElementById('etat');
  const statut = document.getElementById('statut');
  const liste = document.getElementById('liste');
  const couche = L.markerClusterGroup({
    chunkedLoading: true, maxClusterRadius: 20, showCoverageOnHover: false,
    disableClusteringAtZoom: 15
  }).addTo(carte);

  const points = [];             // {nom, groupes, lat, lon, id, cat}
  const cats = {};               // nom -> {n, actif, groupe, couleur, emoji, libelle, icone, li, cb}
  let recherche = '';

  function echapper(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ----- Plein écran -----
  const BoutonPlein = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const b = L.DomUtil.create('button', 'btn-plein');
      b.type = 'button';
      b.textContent = 'Plein écran';
      L.DomEvent.disableClickPropagation(b);
      L.DomEvent.on(b, 'click', basculerPlein);
      this._b = b;
      return b;
    }
  });
  const boutonPlein = new BoutonPlein().addTo(carte);

  function estPlein() {
    return cadre.classList.contains('plein') || document.fullscreenElement === cadre;
  }
  function basculerPlein() {
    if (estPlein()) {
      if (document.fullscreenElement) document.exitFullscreen();
      cadre.classList.remove('plein');
    } else if (cadre.requestFullscreen) {
      cadre.requestFullscreen().catch(function () { cadre.classList.add('plein'); });
    } else {
      cadre.classList.add('plein');
    }
    majBouton();
  }
  function majBouton() {
    setTimeout(function () {
      boutonPlein._b.textContent = estPlein() ? 'Quitter le plein écran' : 'Plein écran';
      carte.invalidateSize();
    }, 150);
  }
  document.addEventListener('fullscreenchange', majBouton);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && cadre.classList.contains('plein')) basculerPlein();
  });

  // ----- Catégories -----
  function construireCategories() {
    const noms = Object.keys(cats);
const TEINTES = {
  'Courses et nourriture': 28, 'Carburant': 50, 'Eau et sanitaires': 210,
  'Santé et argent': 355, 'Vélo': 175, 'Pause et plein air': 130,
  'Hébergement': 275, 'Patrimoine': 320,
  'Découverte': 90, 'Information': 240, 'Services pratiques': 20
};
    noms.forEach(function (n) {
      const m = n.match(/^(\p{Extended_Pictographic}\S*)\s+(.+)$/u);
      cats[n].emoji = m ? m[1] : '•';
      cats[n].libelle = m ? m[2] : n;
    });
    noms.sort(function (a, b) {
      return cats[b].n - cats[a].n || cats[a].libelle.localeCompare(cats[b].libelle, 'fr');
    });
    const parGroupe = {};
    noms.forEach(function (n) { (parGroupe[cats[n].groupe || ''] = parGroupe[cats[n].groupe || ''] || []).push(n); });
    Object.keys(parGroupe).forEach(function (g, gi) {
      const membres = parGroupe[g], k = membres.length;
      const h = g in TEINTES ? TEINTES[g] : (gi * 137.5) % 360;
      membres.forEach(function (n, j) {
        const clarte = k === 1 ? 50 : 38 + 26 * j / (k - 1);
        const teinte = h + (j - (k - 1) / 2) * 8;
        cats[n].couleur = 'hsl(' + Math.round((teinte + 360) % 360) + ',75%,' + Math.round(clarte) + '%)';
      });
    });
    noms.forEach(function (nom) {
      const c = cats[nom];
      const html = '<span class="pin" style="background:' + c.couleur + '">' + echapper(c.emoji) + '</span>';
      c.icone = L.divIcon({ html: html, className: 'pin-wrap', iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12] });
      const li = document.createElement('li');
      const label = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = true;
      cb.addEventListener('change', function () { c.actif = cb.checked; actualiser(); });
      const pastille = document.createElement('span');
      pastille.className = 'pin';
      pastille.style.background = c.couleur;
      pastille.textContent = c.emoji;
      const libelle = document.createElement('span');
      libelle.className = 'nom-cat';
      libelle.textContent = c.libelle;
      libelle.title = nom;
      const nb = document.createElement('span');
      nb.className = 'nb-cat';
      nb.textContent = c.n.toLocaleString('fr-FR');
      label.append(cb, pastille, libelle, nb);
      li.appendChild(label);
      liste.appendChild(li);
      c.li = li;
      c.cb = cb;
    });
    document.getElementById('titre-liste').textContent = 'Catégories (' + noms.length + ')';
  }

  var modeAz = 'az'; // az ou za
var modeNb = 'nb'; // nb ou bn
function trierListe() {
  if (!Object.keys(cats).length) return;
  Object.keys(cats).sort(function (a, b) {
    var az = modeAz === 'az'
      ? cats[a].libelle.localeCompare(cats[b].libelle, 'fr')
      : cats[b].libelle.localeCompare(cats[a].libelle, 'fr');
    var nb = modeNb === 'nb'
      ? cats[b].n - cats[a].n
      : cats[a].n - cats[b].n;
    return az || nb;
  }).forEach(function (n) { liste.appendChild(cats[n].li); });
}
document.getElementById('tri-az').addEventListener('click', function () {
  modeAz = modeAz === 'az' ? 'za' : 'az';
  this.textContent = modeAz === 'az' ? 'A → Z' : 'Z → A';
  trierListe();
});
document.getElementById('tri-nb').addEventListener('click', function () {
  modeNb = modeNb === 'nb' ? 'bn' : 'nb';
  this.textContent = modeNb === 'nb' ? '9 → 1' : '1 → 9';
  trierListe();
});

  function categoriesAffichees() {
    return Object.keys(cats).filter(function (n) { return cats[n].li.style.display !== 'none'; });
  }

  document.getElementById('rech-lieu').addEventListener('input', function (e) {
    recherche = e.target.value.trim().toLowerCase();
    actualiser();
  });
  function cocherTout(valeur) {
    categoriesAffichees().forEach(function (n) { cats[n].actif = valeur; cats[n].cb.checked = valeur; });
    actualiser();
  }
  var toutCoche = true;
document.getElementById('tout-toggle').addEventListener('click', function () {
  toutCoche = !toutCoche;
  this.textContent = toutCoche ? '✓ Tout' : '✗ Tout';
  cocherTout(toutCoche);
});

  // ----- Affichage des points -----
  function actualiser() {
    if (!points.length) return;
    const retenus = points.filter(function (p) {
      return cats[p.cat].actif && (!recherche || p.nom.toLowerCase().indexOf(recherche) !== -1);
    });
    couche.clearLayers();
    couche.addLayers(retenus.map(function (p) {
      if (!p.m) {
        p.m = L.marker([p.lat, p.lon], { icon: cats[p.cat].icone });
        p.m.bindPopup(function () {
          const c = cats[p.cat];
          const boite = document.createElement('div');

          const nom = document.createElement('div');
          nom.className = 'popup-nom';
          nom.textContent = p.nom;
          boite.appendChild(nom);

          // Ligne catégorie : émoji + libellé, puis bouton « Y aller »
          const ligne = document.createElement('div');
          ligne.className = 'popup-ligne';
          ligne.appendChild(document.createTextNode(p.cat + ' '));
          const aller = document.createElement('a');
          aller.className = 'popup-go';
          aller.textContent = 'Y aller';
          aller.href = 'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon;
          aller.target = '_blank';
          aller.rel = 'noopener';
          ligne.appendChild(aller);
          boite.appendChild(ligne);
          if (p.groupes) {
            const g = document.createElement('div');
            g.className = 'popup-ligne';
            g.textContent = p.groupes;
            boite.appendChild(g);
          }
          const id = document.createElement('div');
          id.className = 'popup-ligne';
          id.textContent = 'ID ' + p.id;
          boite.appendChild(id);

          return boite;
        });
      }
      return p.m;
    }));
    etat.textContent = retenus.length.toLocaleString('fr-FR') + ' lieu(x) sélectionné(s)';
  }

  // ----- Chargement -----
  fetch(DOSSIER + 'carres.json')
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (carres) {
      if (!carres.length) throw new Error('vide');
      const sud = Math.min.apply(null, carres.map(function (c) { return c.lat; }));
      const nord = Math.max.apply(null, carres.map(function (c) { return c.lat + 0.5; }));
      const ouest = Math.min.apply(null, carres.map(function (c) { return c.lon; }));
      const est = Math.max.apply(null, carres.map(function (c) { return c.lon + 0.5; }));
      carte.fitBounds([[sud, ouest], [nord, est]]);

      let faits = 0, echecs = 0;
      return Promise.all(carres.map(function (c) {
        return fetch(DOSSIER + c.id + '.json')
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function (lignes) {
            lignes.forEach(function (l) {
              const cat = String(l[2] == null ? '' : l[2]).trim() || SANS_TYPE;
              if (!cats[cat]) cats[cat] = { n: 0, actif: true, groupe: String(l[1] == null ? '' : l[1]) };
              cats[cat].n++;
              points.push({ nom: String(l[0] == null ? '' : l[0]), groupes: l[1], lat: l[3], lon: l[4], id: l[5], cat: cat });
            });
          })
          .catch(function () { echecs++; })
          .then(function () {
            faits++;
            statut.textContent = 'Chargement des données : ' + faits + ' / ' + carres.length + ' carrés';
          });
      })).then(function () { return echecs; });
    })
    .then(function (echecs) {
      construireCategories();
      statut.textContent = points.length.toLocaleString('fr-FR') + ' lieux dans ' + Object.keys(cats).length + ' catégories' +
        (echecs ? ' · ' + echecs + ' carré(s) non chargé(s)' : '');
      actualiser();
    })
    .catch(function () {
      statut.textContent = 'Impossible de lire poi/carres.json';
      etat.textContent = 'Données indisponibles';
      carte.setView([46.5, 2.5], 6);
    });
})();
</script>
</body>
</html>
