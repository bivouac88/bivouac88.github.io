<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Météo &amp; pêche · Bivouac88</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../style.css">
  <style>
    .pos { font: 500 11px var(--mono); color: var(--accent); border: 1px solid var(--accent-trait); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
    .pos.warn { color: var(--discret); border-color: var(--trait); }
    section { margin-bottom: 26px; }
    h2.bloc { font: 600 17px var(--serif); letter-spacing: -0.01em; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--trait); }
    .etat { color: var(--discret); font: 400 13px var(--mono); padding: 8px 0; }

    .grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric { background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: 10px 12px; }
    .metric.large { grid-column: span 2; }
    .metric .k { font: 400 11px var(--mono); color: var(--discret); }
    .metric .v { font: 600 22px var(--serif); line-height: 1.2; }
    .metric .s { font: 400 11px var(--mono); color: var(--discret); margin-top: 2px; }
    .hausse { color: var(--succes); }
    .baisse { color: var(--accent); }

    .defile { overflow-x: auto; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font: 400 12px var(--mono); }
    th { text-align: right; font-weight: 500; color: var(--discret); padding: 8px 10px; border-bottom: 1px solid var(--trait); }
    td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--trait-subtil); }
    th:first-child, td:first-child { text-align: left; }
    tr:last-child td { border-bottom: none; }
    tr.now td { background: var(--accent-fond); }

    .filtres { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 10px; font: 400 12px var(--mono); color: var(--discret); }
    .filtres label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .filtres input { accent-color: var(--accent); }
    .filtres select { font: inherit; color: var(--papier); background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; padding: 3px 6px; }

    .liste { display: flex; flex-direction: column; gap: 6px; }
    .poi { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: 9px 12px; color: inherit; text-decoration: none; transition: border-color .15s ease, background-color .15s ease; }
    .poi:hover { border-color: var(--accent-trait); background: var(--carte-hover); }
    .poi .nom { font: 600 15px var(--serif); }
    .poi .type { font: 400 11px var(--mono); color: var(--discret); }
    .poi .km { font: 600 13px var(--mono); color: var(--accent); white-space: nowrap; }
    .plus { margin-top: 10px; font: 500 12px var(--mono); color: var(--accent); background: none; border: 1px solid var(--accent-trait); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    .plus:hover { background: var(--accent-fond); }
  </style>
</head>
<body>
  <button class="bouton-theme" id="theme" type="button" aria-label="Changer de thème">◐</button>
  <main>
    <div class="ligne-haut">
      <a class="retour" href="../">← Bivouac88</a>
      <span class="pos warn" id="pos">position…</span>
    </div>

    <h1 class="titre-page">Météo &amp; pêche</h1>
    <p class="sous-titre-page" id="sous-titre">Météo en direct et plans d'eau proches de toi</p>

    <div id="erreur"></div>
    <div id="app"><div class="etat">Localisation en cours…</div></div>

    <p class="pied">DONNÉES : OPEN-METEO · OPENSTREETMAP</p>
  </main>

<script>
(function () {
  // ── Thème (clair / sombre) ────────────────────────────────────────────────
  var racine = document.documentElement;
  var theme = null;
  try { theme = localStorage.getItem('theme'); } catch (e) {}
  if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  racine.setAttribute('data-theme', theme);
  document.getElementById('theme').addEventListener('click', function () {
    theme = theme === 'light' ? 'dark' : 'light';
    racine.setAttribute('data-theme', theme);
    try { localStorage.setItem('theme', theme); } catch (e) {}
  });

  // ── Codes météo ───────────────────────────────────────────────────────────
  var CODES = {
    0:'☀️ Dégagé', 1:'🌤️ Peu nuageux', 2:'⛅ Partiellement nuageux', 3:'☁️ Couvert',
    45:'🌫️ Brouillard', 48:'🌫️ Brouillard givrant',
    51:'🌦️ Bruine légère', 53:'🌦️ Bruine', 55:'🌧️ Bruine dense',
    61:'🌧️ Pluie faible', 63:'🌧️ Pluie', 65:'🌧️ Pluie forte',
    71:'🌨️ Neige faible', 73:'🌨️ Neige', 75:'❄️ Neige forte',
    80:'🌦️ Averses', 81:'🌧️ Averses mod.', 82:'⛈️ Averses fortes',
    95:'⛈️ Orage', 96:'⛈️ Orage + grêle', 99:'⛈️ Orage + forte grêle'
  };

  // ── Utilitaires ───────────────────────────────────────────────────────────
  function n(v, d) {
    if (v === null || v === undefined) return '–';
    return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function signe(v) { return v === null ? '–' : (v >= 0 ? '+' : '') + n(v, 1); }
  function boussole(deg) { return ['N','NE','E','SE','S','SO','O','NO'][Math.round(deg / 45) % 8]; }
  function h(t) { return t ? t.slice(11, 16) : '–'; }
  function jourFr(t) { return new Date(t + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function distKm(lat1, lng1, lat2, lng2) {
    var R = 6371, r = Math.PI / 180;
    var dL = (lat2 - lat1) * r, dG = (lng2 - lng1) * r;
    var a = Math.sin(dL / 2) * Math.sin(dL / 2) + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dG / 2) * Math.sin(dG / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function tendance(d) {
    if (d === null) return ['–', ''];
    if (d >= 3) return ['↑↑ hausse rapide', 'hausse'];
    if (d >= 1) return ['↗ hausse', 'hausse'];
    if (d > -1) return ['→ stable', ''];
    if (d > -3) return ['↘ baisse', 'baisse'];
    return ['↓↓ baisse rapide', 'baisse'];
  }
  function metric(k, v, s, cls) {
    return '<div class="metric' + (cls ? ' ' + cls : '') + '"><div class="k">' + k + '</div><div class="v">' + v + '</div>'
      + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  }
  function tableau(entetes, lignes, nowIdx) {
    var html = '<div class="defile"><table><tr>' + entetes.map(function (e) { return '<th>' + e + '</th>'; }).join('') + '</tr>';
    lignes.forEach(function (l, i) {
      html += '<tr' + (i === nowIdx ? ' class="now"' : '') + '>' + l.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    });
    return html + '</table></div>';
  }
  function erreur(msg) {
    var e = document.getElementById('erreur');
    e.textContent = msg; e.style.display = 'block';
  }

  // ── Étangs : lecture de lacs.json ─────────────────────────────────────────
  var RAYON_KM = 50, PAGE = 20;
  var proches = [], affiches = PAGE;

  function sansNom(p) { return !p.nom || p.nom === 'Sans nom'; }

  function dessinerLacs() {
    var masquer = document.getElementById('f-nom').checked;
    var type = document.getElementById('f-type').value;
    var tab = proches.filter(function (p) {
      if (masquer && sansNom(p)) return false;
      if (type && p.type !== type) return false;
      return true;
    });
    var html = '<div class="liste">';
    tab.slice(0, affiches).forEach(function (p) {
      html += '<a class="poi" href="https://www.google.com/maps?q=' + p.lat + ',' + p.lng + '" target="_blank" rel="noopener">'
        + '<div><div class="nom">' + esc(sansNom(p) ? 'Sans nom' : p.nom) + '</div>'
        + '<div class="type">' + (p.type === 'peche' ? '🎣 Pêche' : '💧 Plan d\'eau') + '</div></div>'
        + '<div class="km">' + n(p.km, 1) + ' km</div></a>';
    });
    html += '</div>';
    if (tab.length > affiches) html += '<button class="plus" id="plus" type="button">Afficher plus (' + (tab.length - affiches) + ')</button>';
    document.getElementById('liste-lacs').innerHTML = tab.length ? html : '<div class="etat">Aucun point avec ces filtres.</div>';
    document.getElementById('compte-lacs').textContent = tab.length + ' point' + (tab.length > 1 ? 's' : '') + ' à moins de ' + RAYON_KM + ' km';
    var b = document.getElementById('plus');
    if (b) b.addEventListener('click', function () { affiches += PAGE; dessinerLacs(); });
  }

  function chargerLacs(lat, lng) {
    fetch('lacs.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('lacs.json : HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        proches = (d.lacs || []).map(function (r) {
          return { id: r[0], nom: r[1], type: r[2], lat: r[3], lng: r[4], km: distKm(lat, lng, r[3], r[4]) };
        }).filter(function (p) { return p.km <= RAYON_KM; })
          .sort(function (a, b) { return a.km - b.km; });
        var maj = d.maj ? new Date(d.maj).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        document.getElementById('maj-lacs').textContent = maj ? 'Liste mise à jour le ' + maj : '';
        document.getElementById('etat-lacs').remove();
        document.getElementById('bloc-lacs').style.display = 'block';
        document.getElementById('f-nom').addEventListener('change', function () { affiches = PAGE; dessinerLacs(); });
        document.getElementById('f-type').addEventListener('change', function () { affiches = PAGE; dessinerLacs(); });
        dessinerLacs();
      })
      .catch(function (e) {
        document.getElementById('etat-lacs').textContent = 'Liste des étangs indisponible (' + e.message + ').';
      });
  }

  // ── Rendu principal ───────────────────────────────────────────────────────
  function render(lat, lng) {
    var pos = document.getElementById('pos');
    pos.textContent = lat.toFixed(4) + ', ' + lng.toFixed(4);
    pos.className = 'pos';
    var app = document.getElementById('app');
    app.innerHTML = '<div class="etat">Chargement météo…</div>';

    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat + '&longitude=' + lng
      + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
      + '&hourly=temperature_2m,precipitation_probability,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset,uv_index_max'
      + '&past_days=1&forecast_days=7&timezone=auto';

    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        var c = d.current, hh = d.hourly, j = d.daily, i = 0;
        for (var k = 0; k < hh.time.length; k++) {
          if (hh.time[k].slice(0, 13) === c.time.slice(0, 13)) { i = k; break; }
        }
        var d3 = i >= 3 ? hh.pressure_msl[i] - hh.pressure_msl[i - 3] : null;
        var d6 = i >= 6 ? hh.pressure_msl[i] - hh.pressure_msl[i - 6] : null;
        var t3 = tendance(d3);
        var html = '';

        html += '<section><h2 class="bloc">' + (CODES[c.weather_code] || 'Maintenant') + '</h2><div class="grille">'
          + metric('Température', n(c.temperature_2m, 1) + '°', 'ressenti ' + n(c.apparent_temperature, 1) + '°')
          + metric('Pression', n(c.pressure_msl) + ' hPa',
              '<span class="' + t3[1] + '">' + t3[0] + ' (' + signe(d3) + ' / 3 h)</span>', 'large')
          + metric('Vent', n(c.wind_speed_10m) + ' km/h', boussole(c.wind_direction_10m))
          + metric('Rafales', n(c.wind_gusts_10m) + ' km/h')
          + metric('Humidité', n(c.relative_humidity_2m) + ' %')
          + metric('Pluie', n(c.precipitation, 1) + ' mm', 'actuellement')
          + metric('Nuages', n(c.cloud_cover) + ' %')
          + metric('Visibilité', hh.visibility[i] !== null ? n(hh.visibility[i] / 1000, 1) + ' km' : '–')
          + metric('Pression 6 h', signe(d6) + ' hPa', 'tendance longue')
          + '</div></section>';

        var l24 = [];
        for (var a = i; a < Math.min(i + 25, hh.time.length); a++) {
          l24.push([h(hh.time[a]), n(hh.temperature_2m[a]) + '°', n(hh.precipitation[a], 1),
            n(hh.precipitation_probability[a]) + '%',
            n(hh.wind_speed_10m[a]) + ' ' + boussole(hh.wind_direction_10m[a]),
            n(hh.wind_gusts_10m[a]), n(hh.pressure_msl[a]), n(hh.cloud_cover[a]) + '%']);
        }
        html += '<section><h2 class="bloc">Prochaines 24 h</h2>'
          + tableau(['Heure','Temp','Pluie mm','Risque','Vent km/h','Rafales','hPa','Nuages'], l24, 0) + '</section>';

        var l7 = [];
        for (var m = 1; m < j.time.length; m++) {
          l7.push([jourFr(j.time[m]),
            (CODES[j.weather_code[m]] || '').split(' ')[0],
            n(j.temperature_2m_min[m]) + '° / ' + n(j.temperature_2m_max[m]) + '°',
            n(j.precipitation_sum[m], 1), n(j.precipitation_probability_max[m]) + '%',
            n(j.wind_speed_10m_max[m]), n(j.wind_gusts_10m_max[m]),
            h(j.sunrise[m]) + ' / ' + h(j.sunset[m]), n(j.uv_index_max[m], 1)]);
        }
        html += '<section><h2 class="bloc">7 jours</h2>'
          + tableau(['Jour','','Min / Max','Pluie','Risque','Vent','Rafales','Lever / Coucher','UV'], l7) + '</section>';

        html += '<section><h2 class="bloc">Plans d\'eau &amp; pêche</h2>'
          + '<div class="etat" id="etat-lacs">Chargement de la liste…</div>'
          + '<div id="bloc-lacs" style="display:none">'
          + '<div class="filtres">'
          + '<label><input type="checkbox" id="f-nom" checked> Masquer les sans nom</label>'
          + '<label>Type <select id="f-type"><option value="">Tous</option><option value="peche">Pêche</option><option value="plan_eau">Plans d\'eau</option></select></label>'
          + '<span id="compte-lacs"></span></div>'
          + '<div id="liste-lacs"></div>'
          + '<p class="etat" id="maj-lacs"></p></div></section>';

        app.innerHTML = html;
        chargerLacs(lat, lng);
      })
      .catch(function (e) {
        app.innerHTML = '';
        erreur('Météo indisponible : ' + e.message);
      });
  }

  // ── Géolocalisation ───────────────────────────────────────────────────────
  var app = document.getElementById('app');
  if (!navigator.geolocation) {
    erreur('Géolocalisation indisponible sur cet appareil. Position par défaut : Namur.');
    render(50.4669, 4.8674);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function (p) {
      render(p.coords.latitude, p.coords.longitude);
      if (p.coords.accuracy > 5000) {
        var b = document.getElementById('pos');
        b.textContent += ' · ±' + Math.round(p.coords.accuracy / 1000) + ' km';
        b.className = 'pos warn';
      }
    },
    function () {
      erreur('Position refusée. Position par défaut : Namur.');
      render(50.4669, 4.8674);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
})();
</script>
</body>
</html>
