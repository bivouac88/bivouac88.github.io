<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Météo &amp; pêche · Bivouac88</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <style>
    /* Page plus large (style.css lit --largeur sur main) */
    :root { --largeur: 1280px; }

    .pos { font: 500 11px var(--mono); color: var(--accent); border: 1px solid var(--accent-trait); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
    .pos.warn { color: var(--discret); border-color: var(--trait); }
    section { margin-bottom: 28px; }
    h2.bloc { font: 600 17px var(--serif); letter-spacing: -0.01em; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--trait); }
    .etat { color: var(--discret); font: 400 13px var(--mono); padding: 8px 0; }
    [hidden] { display: none !important; }

    /* Onglets */
    .onglets { display: flex; gap: 6px; margin: 0 0 16px; position: sticky; top: 0; z-index: 500; padding: 8px 0; background: var(--fond); }
    .onglets button { flex: 1; font: 500 13px var(--mono); color: var(--discret); background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 9px 6px; cursor: pointer; }
    .onglets button[aria-selected="true"] { color: var(--accent); border-color: var(--accent-trait); background: var(--accent-fond); }

    /* Panneaux météo (3 côte à côte, 1 colonne sur téléphone) */
    .panneaux { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .panneau { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 14px 16px; }
    .panneau h3 { font: 500 12px var(--mono); color: var(--discret); margin-bottom: 6px; }
    .gros { font: 600 36px var(--serif); line-height: 1.1; letter-spacing: -0.02em; }
    .gros small { font: 500 15px var(--mono); color: var(--discret); letter-spacing: 0; margin-left: 4px; }
    .sous { font: 400 12px var(--mono); color: var(--discret); margin: 2px 0 10px; min-height: 18px; }
    .l { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--trait-subtil); font: 400 13px var(--mono); }
    .l span:first-child { color: var(--discret); }
    .l span:last-child { color: var(--papier); font-weight: 500; text-align: right; }
    .hausse { color: var(--succes) !important; }
    .baisse { color: var(--accent) !important; }
    .alerte { color: var(--accent) !important; font-weight: 600; }

    /* 24 h : frise horizontale */
    .heures { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
    .heure { flex: 0 0 96px; scroll-snap-align: start; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: 10px 8px; text-align: center; font: 400 12px var(--mono); }
    .heure.now { border-color: var(--accent-trait); background: var(--accent-fond); }
    .heure .t { color: var(--discret); }
    .heure .temp { font: 600 24px var(--serif); margin: 2px 0 6px; }
    .heure div.m { padding: 3px 0; border-top: 1px solid var(--trait-subtil); }
    .heure .d { color: var(--discret); font-size: 11px; }

    /* 7 jours : une carte par jour */
    .jours { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 8px; }
    .jour { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 12px 14px; }
    .jour .nom { font: 600 15px var(--serif); }
    .jour .ciel { font: 400 12px var(--mono); color: var(--discret); margin-bottom: 4px; }
    .jour .minmax { font: 600 22px var(--serif); margin-bottom: 6px; }
    .jour .minmax small { font: 400 13px var(--mono); color: var(--discret); }
    .jour .l { font-size: 12px; padding: 5px 0; }

    /* Filtres */
    .filtres { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; font: 400 12px var(--mono); color: var(--discret); }
    .filtres label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .filtres input[type="checkbox"] { accent-color: var(--accent); }
    .filtres select, .filtres input[type="search"] { font: inherit; color: var(--papier); background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; padding: 5px 8px; }
    .filtres input[type="search"] { flex: 1 1 140px; min-width: 0; }
    #compte { flex-basis: 100%; }

    /* Liste (2 colonnes ou plus sur grand écran) */
    .liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px; }
    .poi { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: 9px 12px; color: inherit; text-decoration: none; transition: border-color .15s ease, background-color .15s ease; }
    .poi:hover { border-color: var(--accent-trait); background: var(--carte-hover); }
    .poi .nom { font: 600 15px var(--serif); }
    .poi .type { font: 400 11px var(--mono); color: var(--discret); }
    .poi .km { font: 600 13px var(--mono); color: var(--accent); white-space: nowrap; }
    .plus { margin-top: 10px; font: 500 12px var(--mono); color: var(--accent); background: none; border: 1px solid var(--accent-trait); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    .plus:hover { background: var(--accent-fond); }

    /* Carte */
    #carte { height: 68vh; min-height: 360px; border: 1px solid var(--trait); border-radius: 10px; background: var(--fond-carte-leaflet, var(--carte)); }
    #carte .leaflet-tile-pane { filter: var(--filtre-tuiles, none); }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--carte); color: var(--papier); }
    .pop .nom { font: 600 15px var(--serif); margin-bottom: 2px; }
    .pop .info { font: 400 12px var(--mono); color: var(--discret); margin-bottom: 8px; }
    .pop a.gm { display: inline-block; font: 500 12px var(--mono); color: var(--accent); border: 1px solid var(--accent-trait); border-radius: 6px; padding: 6px 10px; text-decoration: none; }

    @media (max-width: 900px) {
      .panneaux { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <button class="bouton-theme" id="theme" type="button" aria-label="Changer de thème">◐</button>
  <main>
    <div class="ligne-haut">
      <a class="retour" href="../">← Bivouac88</a>
      <span class="pos warn" id="pos">position…</span>
    </div>

    <h1 class="titre-page">Météo &amp; pêche</h1>
    <p class="sous-titre-page">Météo en direct et plans d'eau proches de toi</p>

    <div class="onglets" role="tablist">
      <button type="button" role="tab" data-tab="meteo" aria-selected="true">Météo</button>
      <button type="button" role="tab" data-tab="carte" aria-selected="false">Carte</button>
      <button type="button" role="tab" data-tab="liste" aria-selected="false">Liste</button>
    </div>

    <div id="erreur"></div>

    <div id="tab-meteo"><div id="meteo"><div class="etat">Localisation en cours…</div></div></div>

    <div id="bloc-filtres" hidden>
      <div class="filtres">
        <label><input type="checkbox" id="f-nom" checked> Masquer les sans nom</label>
        <label>Type
          <select id="f-type">
            <option value="">Tous</option>
            <option value="peche">Pêche</option>
            <option value="plan_eau">Plans d'eau</option>
          </select>
        </label>
        <label>Distance
          <select id="f-dist">
            <option value="0">Toute la région</option>
            <option value="10">10 km</option>
            <option value="25">25 km</option>
            <option value="50">50 km</option>
            <option value="100">100 km</option>
            <option value="200">200 km</option>
          </select>
        </label>
        <input type="search" id="f-q" placeholder="Rechercher un nom">
        <span id="compte">Chargement des points…</span>
      </div>
    </div>

    <div id="tab-carte" hidden><div id="carte"></div></div>
    <div id="tab-liste" hidden>
      <div id="liste-lacs"></div>
      <p class="etat" id="maj-lacs"></p>
    </div>

    <p class="pied">DONNÉES : OPEN-METEO · OPENSTREETMAP</p>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
(function () {
  // ── Thème (clair / sombre) ────────────────────────────────────────────────
  var racine = document.documentElement;
  var theme = null;
  try { theme = localStorage.getItem('theme'); } catch (e) {}
  if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  racine.setAttribute('data-theme', theme);
  document.getElementById('theme').addEventListener('click', function () {
    theme = theme === 'light' ? 'dark' : 'light';
    racine.setAttribute('data-theme', theme);
    try { localStorage.setItem('theme', theme); } catch (e) {}
  });

  // ── Codes météo ───────────────────────────────────────────────────────────
  var CODES = {
    0:'☀️ Dégagé', 1:'🌤️ Peu nuageux', 2:'⛅ Partiellement nuageux', 3:'☁️ Couvert',
    45:'🌫️ Brouillard', 48:'🌫️ Brouillard givrant',
    51:'🌦️ Bruine légère', 53:'🌦️ Bruine', 55:'🌧️ Bruine dense',
    61:'🌧️ Pluie faible', 63:'🌧️ Pluie', 65:'🌧️ Pluie forte',
    71:'🌨️ Neige faible', 73:'🌨️ Neige', 75:'❄️ Neige forte',
    80:'🌦️ Averses', 81:'🌧️ Averses mod.', 82:'⛈️ Averses fortes',
    95:'⛈️ Orage', 96:'⛈️ Orage + grêle', 99:'⛈️ Orage + forte grêle'
  };

  // ── Utilitaires ───────────────────────────────────────────────────────────
  function n(v, d) {
    if (v === null || v === undefined) return '–';
    return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  }
  function heures(s) { return (s === null || s === undefined) ? null : s / 3600; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function signe(v) { return v === null ? '–' : (v >= 0 ? '+' : '') + n(v, 1); }
  function boussole(deg) { return ['N','NE','E','SE','S','SO','O','NO'][Math.round(deg / 45) % 8]; }
  function h(t) { return t ? t.slice(11, 16) : '–'; }
  function jourFr(t) { return new Date(t + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' }); }
  function distKm(lat1, lng1, lat2, lng2) {
    var R = 6371, r = Math.PI / 180;
    var dL = (lat2 - lat1) * r, dG = (lng2 - lng1) * r;
    var a = Math.sin(dL / 2) * Math.sin(dL / 2) + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dG / 2) * Math.sin(dG / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function tendance(d) {
    if (d === null) return ['–', ''];
    if (d >= 3) return ['↑↑ hausse rapide', 'hausse'];
    if (d >= 1) return ['↗ hausse', 'hausse'];
    if (d > -1) return ['→ stable', ''];
    if (d > -3) return ['↘ baisse', 'baisse'];
    return ['↓↓ baisse rapide', 'baisse'];
  }
  // Une ligne "libellé ... valeur"
  function l(k, v, cls) {
    return '<div class="l"><span>' + k + '</span><span' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</span></div>';
  }
  function erreur(msg) {
    var e = document.getElementById('erreur');
    e.textContent = msg; e.style.display = 'block';
  }
  function $(id) { return document.getElementById(id); }

  // ── État ──────────────────────────────────────────────────────────────────
  var POS = null;
  var tous = [];
  var PAGE = 20, affiches = PAGE;
  var carte = null, couche = null, ongletActif = 'meteo', chargeOk = false;

  function sansNom(p) { return !p.nom || p.nom === 'Sans nom'; }
  function libelleType(t) { return t === 'peche' ? '🎣 Pêche' : '💧 Plan d\'eau'; }
  function normType(t) { return (t === 'peche' || String(t).indexOf('Pêche') >= 0) ? 'peche' : 'plan_eau'; }
  function lienGM(p) { return 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng; }

  // ── Filtres communs ───────────────────────────────────────────────────────
  function filtrer() {
    var masquer = $('f-nom').checked;
    var type = $('f-type').value;
    var dist = Number($('f-dist').value);
    var q = $('f-q').value.trim().toLowerCase();
    return tous.filter(function (p) {
      if (masquer && sansNom(p)) return false;
      if (type && p.type !== type) return false;
      if (dist && p.km > dist) return false;
      if (q && (p.nom || '').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function dessinerListe(tab) {
    var html = '<div class="liste">';
    tab.slice(0, affiches).forEach(function (p) {
      html += '<a class="poi" href="' + lienGM(p) + '" target="_blank" rel="noopener">'
        + '<div><div class="nom">' + esc(sansNom(p) ? 'Sans nom' : p.nom) + '</div>'
        + '<div class="type">' + libelleType(p.type) + '</div></div>'
        + '<div class="km">' + n(p.km, 1) + ' km</div></a>';
    });
    html += '</div>';
    if (tab.length > affiches) html += '<button class="plus" id="plus" type="button">Afficher plus (' + (tab.length - affiches) + ')</button>';
    $('liste-lacs').innerHTML = tab.length ? html : '<div class="etat">Aucun point avec ces filtres.</div>';
    var b = $('plus');
    if (b) b.addEventListener('click', function () { affiches += PAGE; dessinerListe(tab); });
  }

  function dessinerCarte(tab, recentrer) {
    if (!carte) return;
    couche.clearLayers();
    tab.forEach(function (p) {
      var m = L.circleMarker([p.lat, p.lng], {
        radius: 7, weight: 2, fillOpacity: 0.85,
        color: p.type === 'peche' ? '#e0813a' : '#3b8fd9',
        fillColor: p.type === 'peche' ? '#e0813a' : '#3b8fd9'
      });
      m.bindPopup('<div class="pop"><div class="nom">' + esc(sansNom(p) ? 'Sans nom' : p.nom) + '</div>'
        + '<div class="info">' + libelleType(p.type) + ' · ' + n(p.km, 1) + ' km</div>'
        + '<a class="gm" href="' + lienGM(p) + '" target="_blank" rel="noopener">Ouvrir dans Google Maps</a></div>');
      couche.addLayer(m);
    });
    if (recentrer && POS) {
      var d = Number($('f-dist').value);
      var zoom = !d ? 9 : d <= 10 ? 12 : d <= 25 ? 10 : d <= 50 ? 9 : d <= 100 ? 8 : 7;
      carte.setView([POS.lat, POS.lng], zoom);
    }
  }

  function initCarte() {
    if (carte || !POS) return;
    carte = L.map('carte').setView([POS.lat, POS.lng], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '© OpenStreetMap'
    }).addTo(carte);
    couche = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
    carte.addLayer(couche);
    L.circleMarker([POS.lat, POS.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#d33', fillOpacity: 1 })
      .addTo(carte).bindTooltip('Toi');
  }

  function majVues(recentrer) {
    if (!chargeOk) return;
    var tab = filtrer();
    $('compte').textContent = tab.length + ' point' + (tab.length > 1 ? 's' : '');
    if (ongletActif === 'liste') dessinerListe(tab);
    if (ongletActif === 'carte') { initCarte(); carte.invalidateSize(); dessinerCarte(tab, recentrer); }
  }

  // ── Onglets ───────────────────────────────────────────────────────────────
  function ouvrir(nom) {
    ongletActif = nom;
    Array.prototype.forEach.call(document.querySelectorAll('.onglets button'), function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-tab') === nom ? 'true' : 'false');
    });
    $('tab-meteo').hidden = nom !== 'meteo';
    $('tab-carte').hidden = nom !== 'carte';
    $('tab-liste').hidden = nom !== 'liste';
    $('bloc-filtres').hidden = nom === 'meteo';
    affiches = PAGE;
    majVues(nom === 'carte' && !carte);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.onglets button'), function (b) {
    b.addEventListener('click', function () { ouvrir(b.getAttribute('data-tab')); });
  });
  ['f-nom', 'f-type'].forEach(function (id) {
    $(id).addEventListener('change', function () { affiches = PAGE; majVues(false); });
  });
  $('f-dist').addEventListener('change', function () { affiches = PAGE; majVues(true); });
  $('f-q').addEventListener('input', function () { affiches = PAGE; majVues(false); });

  // ── Chargement des points (lacs.json) ─────────────────────────────────────
  function chargerLacs() {
    fetch('lacs.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('lacs.json : HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        tous = (d.lacs || []).map(function (r) {
          return { id: r[0], nom: r[1], type: normType(r[2]), lat: r[3], lng: r[4], km: distKm(POS.lat, POS.lng, r[3], r[4]) };
        }).sort(function (a, b) { return a.km - b.km; });
        var maj = d.maj ? new Date(d.maj).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        $('maj-lacs').textContent = maj ? 'Liste mise à jour le ' + maj : '';
        chargeOk = true;
        majVues(ongletActif === 'carte' && !carte);
      })
      .catch(function (e) {
        $('compte').textContent = 'Liste des étangs indisponible (' + e.message + ').';
      });
  }

  // ── Météo ─────────────────────────────────────────────────────────────────
  function chargerMeteo(lat, lng) {
    var app = $('meteo');
    app.innerHTML = '<div class="etat">Chargement météo…</div>';
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat + '&longitude=' + lng
      + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
      + '&hourly=temperature_2m,precipitation_probability,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset,uv_index_max,sunshine_duration,daylight_duration'
      + '&past_days=1&forecast_days=7&timezone=auto';

    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        var c = d.current, hh = d.hourly, j = d.daily, i = 0;
        for (var k = 0; k < hh.time.length; k++) {
          if (hh.time[k].slice(0, 13) === c.time.slice(0, 13)) { i = k; break; }
        }
        var d3 = i >= 3 ? hh.pressure_msl[i] - hh.pressure_msl[i - 3] : null;
        var d6 = i >= 6 ? hh.pressure_msl[i] - hh.pressure_msl[i - 6] : null;
        var t3 = tendance(d3), t6 = tendance(d6);
        var html = '';

        // j[1] = aujourd'hui (la requête inclut past_days=1)
        html += '<section><div class="panneaux">'
          // Ciel
          + '<div class="panneau"><h3>Ciel</h3>'
          + '<div class="gros">' + n(c.temperature_2m, 1) + '°</div>'
          + '<div class="sous">' + (CODES[c.weather_code] || '') + ' · ressenti ' + n(c.apparent_temperature, 1) + '°</div>'
          + l('Nuages', n(c.cloud_cover) + ' %')
          + l('Soleil aujourd\'hui', n(heures(j.sunshine_duration[1]), 1) + ' h sur ' + n(heures(j.daylight_duration[1]), 1) + ' h')
          + l('Lever / coucher', h(j.sunrise[1]) + ' / ' + h(j.sunset[1]))
          + '</div>'
          // Vent et pluie
          + '<div class="panneau"><h3>Vent et pluie</h3>'
          + '<div class="gros">' + n(c.wind_speed_10m) + '<small>km/h ' + boussole(c.wind_direction_10m) + '</small></div>'
          + '<div class="sous">vent actuel</div>'
          + l('Rafales', n(c.wind_gusts_10m) + ' km/h')
          + l('Pluie actuelle', n(c.precipitation, 1) + ' mm')
          + l('Humidité', n(c.relative_humidity_2m) + ' %')
          + l('Visibilité', hh.visibility[i] !== null ? n(hh.visibility[i] / 1000, 1) + ' km' : '–')
          + '</div>'
          // Pression
          + '<div class="panneau"><h3>Pression (pêche)</h3>'
          + '<div class="gros">' + n(c.pressure_msl) + '<small>hPa</small></div>'
          + '<div class="sous"><span class="' + t3[1] + '">' + t3[0] + '</span></div>'
          + l('Tendance 3 h', signe(d3) + ' hPa', t3[1])
          + l('Tendance 6 h', signe(d6) + ' hPa', t6[1])
          + '</div>'
          + '</div></section>';

        // 24 h : frise horizontale
        html += '<section><h2 class="bloc">Prochaines 24 h</h2><div class="heures">';
        for (var a = i; a < Math.min(i + 25, hh.time.length); a++) {
          var risque = hh.precipitation_probability[a], raf = hh.wind_gusts_10m[a];
          html += '<div class="heure' + (a === i ? ' now' : '') + '">'
            + '<div class="t">' + h(hh.time[a]) + '</div>'
            + '<div class="temp">' + n(hh.temperature_2m[a]) + '°</div>'
            + '<div class="m"><span class="' + (risque >= 50 ? 'alerte' : '') + '">' + n(hh.precipitation[a], 1) + ' mm</span><div class="d">risque ' + n(risque) + '%</div></div>'
            + '<div class="m">' + n(hh.wind_speed_10m[a]) + ' ' + boussole(hh.wind_direction_10m[a]) + '<div class="d ' + (raf >= 50 ? 'alerte' : '') + '">raf. ' + n(raf) + '</div></div>'
            + '<div class="m">' + n(hh.pressure_msl[a]) + '<div class="d">hPa</div></div>'
            + '<div class="m">' + n(hh.cloud_cover[a]) + '%<div class="d">nuages</div></div>'
            + '</div>';
        }
        html += '</div></section>';

        // 7 jours : une carte par jour
        html += '<section><h2 class="bloc">7 jours</h2><div class="jours">';
        for (var m = 1; m < j.time.length; m++) {
          var rj = j.precipitation_probability_max[m], gj = j.wind_gusts_10m_max[m];
          html += '<div class="jour">'
            + '<div class="nom">' + jourFr(j.time[m]) + '</div>'
            + '<div class="ciel">' + (CODES[j.weather_code[m]] || '–') + '</div>'
            + '<div class="minmax">' + n(j.temperature_2m_min[m]) + '° <small>/</small> ' + n(j.temperature_2m_max[m]) + '°</div>'
            + l('Pluie', n(j.precipitation_sum[m], 1) + ' mm · ' + n(rj) + '%', rj >= 50 ? 'alerte' : '')
            + l('Vent', n(j.wind_speed_10m_max[m]) + ' km/h')
            + l('Rafales', n(gj) + ' km/h', gj >= 50 ? 'alerte' : '')
            + l('Soleil', n(heures(j.sunshine_duration[m]), 1) + ' h')
            + l('Lever / coucher', h(j.sunrise[m]) + ' / ' + h(j.sunset[m]))
            + l('UV', n(j.uv_index_max[m], 1))
            + '</div>';
        }
        html += '</div></section>';

        app.innerHTML = html;
      })
      .catch(function (e) {
        app.innerHTML = '';
        erreur('Météo indisponible : ' + e.message);
      });
  }

  // ── Démarrage ─────────────────────────────────────────────────────────────
  function demarrer(lat, lng) {
    POS = { lat: lat, lng: lng };
    var pos = $('pos');
    pos.textContent = lat.toFixed(4) + ', ' + lng.toFixed(4);
    pos.className = 'pos';
    chargerMeteo(lat, lng);
    chargerLacs();
  }

  if (!navigator.geolocation) {
    erreur('Géolocalisation indisponible sur cet appareil. Position par défaut : Namur.');
    demarrer(50.4669, 4.8674);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function (p) {
      demarrer(p.coords.latitude, p.coords.longitude);
      if (p.coords.accuracy > 5000) {
        var b = $('pos');
        b.textContent += ' · ±' + Math.round(p.coords.accuracy / 1000) + ' km';
        b.className = 'pos warn';
      }
    },
    function () {
      erreur('Position refusée. Position par défaut : Namur.');
      demarrer(50.4669, 4.8674);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
})();
</script>
</body>
</html>
