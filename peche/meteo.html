<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Météo &amp; pêche · Bivouac88</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <meta name="theme-color" content="#e58e26">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
  <style>
    /* Page plus large (style.css lit --largeur sur main) */
    :root { --largeur: 1280px; }

    .pos { font: 500 11px var(--mono); color: var(--accent); border: 1px solid var(--accent-trait); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
    .pos.warn { color: var(--discret); border-color: var(--trait); }
    .sous-titre-page .pos { margin-left: 8px; }
    .ligne-haut { margin-bottom: 12px; }
    .marque { flex-wrap: wrap; gap: 6px 10px; }
    .marque small { margin-left: 6px; white-space: nowrap; }
    section { margin-bottom: 28px; }
    h2.bloc { font: 600 17px var(--serif); letter-spacing: -0.01em; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--trait); }
    .etat { color: var(--discret); font: 400 13px var(--mono); padding: 8px 0; }
    [hidden] { display: none !important; }

    /* Onglets */
    .onglets { display: flex; gap: 6px; margin: 0 0 16px; position: sticky; top: 0; z-index: 500; padding: 8px 0; background: var(--fond); }
    .onglets button { flex: 1; font: 500 13px var(--mono); color: var(--discret); background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 9px 6px; cursor: pointer; }
    .onglets button[aria-selected="true"] { color: var(--accent); border-color: var(--accent-trait); background: var(--accent-fond); }

    /* Panneaux météo (3 côte à côte, 1 colonne sur téléphone) */
    .panneaux { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .panneau { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 14px 16px; }
    .panneau h3 { font: 500 12px var(--mono); color: var(--discret); margin-bottom: 6px; }
    .gros { font: 600 36px var(--serif); line-height: 1.1; letter-spacing: -0.02em; }
    .gros small { font: 500 15px var(--mono); color: var(--discret); letter-spacing: 0; margin-left: 4px; }
    .sous { font: 400 12px var(--mono); color: var(--discret); margin: 2px 0 10px; min-height: 18px; }
    .l { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--trait-subtil); font: 400 13px var(--mono); }
    .l span:first-child { color: var(--discret); }
    .l span:last-child { color: var(--papier); font-weight: 500; text-align: right; }
    .hausse { color: var(--succes) !important; }
    .baisse { color: var(--accent) !important; }
    .alerte { color: var(--accent) !important; font-weight: 600; }

    /* 24 h : frise horizontale */
    .heures { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
    .heure { flex: 0 0 96px; scroll-snap-align: start; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: 10px 8px; text-align: center; font: 400 12px var(--mono); }
    .heure.now { border-color: var(--accent-trait); background: var(--accent-fond); }
    .heure .t { color: var(--discret); }
    .heure .temp { font: 600 24px var(--serif); margin: 2px 0 6px; }
    .heure div.m { padding: 3px 0; border-top: 1px solid var(--trait-subtil); }
    .heure .d { color: var(--discret); font-size: 11px; }

    /* 7 jours : une carte par jour */
    .jours { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 8px; }
    .jour { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 12px 14px; }
    .jour .nom { font: 600 15px var(--serif); }
    .jour .ciel { font: 400 12px var(--mono); color: var(--discret); margin-bottom: 4px; }
    .jour .minmax { font: 600 22px var(--serif); margin-bottom: 6px; }
    .jour .minmax small { font: 400 13px var(--mono); color: var(--discret); }
    .jour .l { font-size: 12px; padding: 5px 0; }

    /* Pêche : indicateur */
    h2.bloc small { font: 400 11px var(--mono); color: var(--discret); margin-left: 8px; }
    .peche-tete { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .peche-tete button { font: 500 12px var(--mono); color: var(--discret); background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    .peche-tete button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-trait); background: var(--accent-fond); }
    .peche-corps { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 14px 16px; }
    .poissons { letter-spacing: 2px; line-height: 1.2; white-space: nowrap; }
    .poissons .off { opacity: .18; filter: grayscale(1); }
    .verdict { display: inline-flex; align-items: center; gap: 12px; border: 1px solid var(--trait); border-radius: 10px; padding: 8px 14px; font: 600 15px var(--mono); }
    .verdict .poissons { font-size: 26px; }
    .verdict.n3 { color: var(--succes); border-color: var(--succes); background: rgba(91, 163, 112, 0.12); }
    .verdict.n2 { color: var(--accent); border-color: var(--accent-trait); background: var(--accent-fond); }
    .verdict.n1 { color: var(--discret); }
    .pj .poissons { font-size: 13px; letter-spacing: 0; }
    .peche-corps details { margin-top: 12px; font: 400 12px var(--mono); color: var(--discret); }
    .peche-corps summary { cursor: pointer; }
    .peche-corps details p { margin-top: 6px; line-height: 1.5; }

    /* Fond d'écran selon le temps */
    #fond-meteo { position: fixed; inset: 0; z-index: 0; pointer-events: none; transition: background 1.2s ease; }
    [data-theme="light"] #fond-meteo { opacity: .7; }
    #fond-meteo[data-fond="jour"] { background: radial-gradient(ellipse 90% 60% at 50% -10%, rgba(229,142,38,.28), transparent 70%); }
    #fond-meteo[data-fond="nuit"] { background: linear-gradient(180deg, rgba(25,40,95,.45), transparent 65%); }
    #fond-meteo[data-fond="nuit-nuageux"] { background: linear-gradient(180deg, rgba(40,48,70,.5), transparent 65%); }
    #fond-meteo[data-fond="nuageux"] { background: linear-gradient(180deg, rgba(120,130,145,.28), transparent 60%); }
    #fond-meteo[data-fond="brouillard"] { background: linear-gradient(180deg, rgba(170,170,165,.3), rgba(170,170,165,.08)); }
    #fond-meteo[data-fond="pluie"] { background: linear-gradient(180deg, rgba(60,100,150,.38), transparent 70%); }
    #fond-meteo[data-fond="neige"] { background: linear-gradient(180deg, rgba(200,215,235,.3), transparent 70%); }
    #fond-meteo[data-fond="orage"] { background: linear-gradient(180deg, rgba(70,50,110,.5), transparent 70%); }
    #fond-meteo[data-fond="pluie"]::after, #fond-meteo[data-fond="orage"]::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, rgba(180,200,230,.16) 0 1px, transparent 1px 24px); background-size: 96px 96px; }
    @media (prefers-reduced-motion: no-preference) {
      #fond-meteo[data-fond="pluie"]::after, #fond-meteo[data-fond="orage"]::after { animation: pluie .9s linear infinite; }
      @keyframes pluie { to { background-position: -24px 96px; } }
    }

    /* Détails + barres */
    .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
    .barres { display: flex; gap: 2px; height: 84px; margin: 4px 0 10px; }
    .bc { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .bz { flex: 1; display: flex; align-items: flex-end; }
    .b { width: 100%; background: var(--accent-trait); border-radius: 2px 2px 0 0; min-height: 2px; }
    .b.n3 { background: var(--succes); } .b.n2 { background: var(--accent); } .b.n1 { background: var(--trait-actif); }
    .bc span { height: 12px; font: 400 9px var(--mono); color: var(--discret); text-align: center; }
    .score { font: 600 28px var(--serif); } .score small { font: 400 12px var(--mono); color: var(--discret); }

    /* Filtres */
    .filtres { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 12px; font: 400 12px var(--mono); color: var(--discret); }
    .filtres label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .filtres input[type="checkbox"] { accent-color: var(--accent); }
    .filtres select, .filtres input[type="search"] { font: inherit; color: var(--papier); background: var(--carte); border: 1px solid var(--trait); border-radius: 6px; padding: 5px 8px; }
    .filtres input[type="search"] { flex: 1 1 140px; min-width: 0; }
    #compte { flex-basis: 100%; }

    /* Liste (2 colonnes ou plus sur grand écran) */
    .liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px; }
    .poi { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: 9px 12px; color: inherit; text-decoration: none; transition: border-color .15s ease, background-color .15s ease; }
    .poi:hover { border-color: var(--accent-trait); background: var(--carte-hover); }
    .poi .nom { font: 600 15px var(--serif); }
    .poi .type { font: 400 11px var(--mono); color: var(--discret); }
    .poi .km { font: 600 13px var(--mono); color: var(--accent); white-space: nowrap; }
    .plus { margin-top: 10px; font: 500 12px var(--mono); color: var(--accent); background: none; border: 1px solid var(--accent-trait); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    .plus:hover { background: var(--accent-fond); }

    /* Carte */
    #carte { height: 68vh; min-height: 360px; border: 1px solid var(--trait); border-radius: 10px; background: var(--fond-carte-leaflet, var(--carte)); }
    #carte .leaflet-tile-pane { filter: var(--filtre-tuiles, none); }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--carte); color: var(--papier); }
    .pop .nom { font: 600 15px var(--serif); margin-bottom: 2px; }
    .pop .info { font: 400 12px var(--mono); color: var(--discret); margin-bottom: 8px; }
    .pop a.gm { display: inline-block; font: 500 12px var(--mono); color: var(--accent); border: 1px solid var(--accent-trait); border-radius: 6px; padding: 6px 10px; text-decoration: none; }

    @media (max-width: 900px) {
      .panneaux { grid-template-columns: 1fr; }
    }
  </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
(function () {
  // ── Thème (clair / sombre) ────────────────────────────────────────────────
  var racine = document.documentElement;
  var theme = null;
  try { theme = localStorage.getItem('theme'); } catch (e) {}
  if (!theme) theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  racine.setAttribute('data-theme', theme);
  var iconeSoleil = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var iconeLune = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  function majBoutonTheme() { document.getElementById('theme').innerHTML = (theme === 'light') ? iconeLune : iconeSoleil; }
  majBoutonTheme();
  document.getElementById('theme').addEventListener('click', function () {
    theme = theme === 'light' ? 'dark' : 'light';
    racine.setAttribute('data-theme', theme);
    try { localStorage.setItem('theme', theme); } catch (e) {}
    majBoutonTheme();
  });

  // ── Bouton Partager (même comportement que l'accueil) ─────────────────────
  document.getElementById('btn-partager').addEventListener('click', function () {
    if (navigator.share) { navigator.share({ title: 'Bivouac88', url: window.location.href }); }
    else { navigator.clipboard.writeText(window.location.href); }
  });

  // ── Codes météo ───────────────────────────────────────────────────────────
  var CODES = {
    0:'☀️ Dégagé', 1:'🌤️ Peu nuageux', 2:'⛅ Partiellement nuageux', 3:'☁️ Couvert',
    45:'🌫️ Brouillard', 48:'🌫️ Brouillard givrant',
    51:'🌦️ Bruine légère', 53:'🌦️ Bruine', 55:'🌧️ Bruine dense',
    61:'🌧️ Pluie faible', 63:'🌧️ Pluie', 65:'🌧️ Pluie forte',
    71:'🌨️ Neige faible', 73:'🌨️ Neige', 75:'❄️ Neige forte',
    80:'🌦️ Averses', 81:'🌧️ Averses mod.', 82:'⛈️ Averses fortes',
    95:'⛈️ Orage', 96:'⛈️ Orage + grêle', 99:'⛈️ Orage + forte grêle'
  };

  // ── Utilitaires ───────────────────────────────────────────────────────────
  function n(v, d) {
    if (v === null || v === undefined) return '–';
    return Number(v).toLocaleString('fr-FR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  }
  function heures(s) { return (s === null || s === undefined) ? null : s / 3600; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function signe(v) { return v === null ? '–' : (v >= 0 ? '+' : '') + n(v, 1); }
  function boussole(deg) { return ['N','NE','E','SE','S','SO','O','NO'][Math.round(deg / 45) % 8]; }
  function h(t) { return t ? t.slice(11, 16) : '–'; }
  function jourFr(t) { return new Date(t + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' }); }
  function distKm(lat1, lng1, lat2, lng2) {
    var R = 6371, r = Math.PI / 180;
    var dL = (lat2 - lat1) * r, dG = (lng2 - lng1) * r;
    var a = Math.sin(dL / 2) * Math.sin(dL / 2) + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dG / 2) * Math.sin(dG / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function tendance(d) {
    if (d === null) return ['–', ''];
    if (d >= 3) return ['↑↑ hausse rapide', 'hausse'];
    if (d >= 1) return ['↗ hausse', 'hausse'];
    if (d > -1) return ['→ stable', ''];
    if (d > -3) return ['↘ baisse', 'baisse'];
    return ['↓↓ baisse rapide', 'baisse'];
  }
  // Une ligne "libellé ... valeur"
  function l(k, v, cls) {
    return '<div class="l"><span>' + k + '</span><span' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</span></div>';
  }
  function erreur(msg) {
    var e = document.getElementById('erreur');
    e.textContent = msg; e.style.display = 'block';
  }
  function $(id) { return document.getElementById(id); }

  // ── Icône du ciel : jour / nuit ───────────────────────────────────────────
  var CODES_NUIT = { 0: '🌙 Dégagé', 1: '🌙 Peu nuageux', 2: '☁️ Partiellement nuageux' };
  function ciel(code, jour) {
    if (jour === 0 && CODES_NUIT[code]) return CODES_NUIT[code];
    return CODES[code] || '';
  }

  // ── Indicateur pêche (INDICATIF) ──────────────────────────────────────────
  // RÉGLAGES : tous les seuils sont ici, modifiables sans toucher au reste.
  var PECHE = {
    seuils: { bon: 2, moyen: 1 },
    echelle: { base: 50, pas: 15 },        // score /100 = base + pas x points (arbitraire, voir Sources et limites)          // score >= bon : 3 poissons ; >= moyen : 2 ; sinon 1
    nuagesCouvert: 70, nuagesDegage: 30,   // % de nuages
    ventMini: 10, ventMaxi: 30, ventFort: 40,   // km/h
    chaleurCarnassiers: 28,                // °C (air)
    carpe: { optMini: 16, optMaxi: 28, froid: 10, chaud: 30 },   // °C (air, approximation de l\'eau)
    autres: { mini: 8, maxi: 28 }          // °C, pour blancs et autres
  };
  var GROUPES = { carnassiers: 'Carnassiers', carpes: 'Carpes', blancs: 'Blancs', autres: 'Autres' };
  var FIABILITE = {
    carnassiers: 'Indice moyen : une étude sur un lac, plus un témoignage de pêcheur',
    carpes: 'Indice moyen : études de laboratoire et captures en compétition',
    blancs: 'Peu de données : température seulement',
    autres: 'Peu de données : température seulement'
  };
  var LIBELLES = ['', 'Faible', 'Moyenne', 'Bonne'];
  var groupePeche = 'carnassiers';
  try { var gs = localStorage.getItem('groupePeche'); if (gs && GROUPES[gs]) groupePeche = gs; } catch (e) {}
  var METEO = null;

  function mins(t) { return Number(t.slice(11, 13)) * 60 + Number(t.slice(14, 16)); }
  function poissons(nb) {
    var h = '';
    for (var k = 1; k <= 3; k++) h += '<span' + (k > nb ? ' class="off"' : '') + '>🐟</span>';
    return '<span class="poissons">' + h + '</span>';
  }

  // x = { nuages %, vent km/h, temp °C (air), tmax °C, nuit (true/false/null), aubeCrep (true/false/null) }
  function evaluerPeche(g, x) {
    var P = PECHE, s = 0, r = [], t = x.temp;
    if (g === 'carnassiers') {
      if (x.nuit === true && !x.aubeCrep) {
        r.push('Nuit : pas de données pour les carnassiers');
      } else {
        if (x.aubeCrep) { s += 1; r.push('Aube ou crépuscule : faible lumière'); }
        if (x.nuages !== null) {
          if (x.nuages >= P.nuagesCouvert) { s += 1; r.push('Ciel couvert (' + n(x.nuages) + ' % de nuages) : faible lumière'); }
          else if (x.nuages <= P.nuagesDegage && !x.aubeCrep) { s -= 1; r.push('Plein soleil (' + n(x.nuages) + ' % de nuages)'); }
        }
      }
      if (x.vent !== null) {
        if (x.vent >= P.ventMini && x.vent <= P.ventMaxi) { s += 1; r.push('Vent modéré (' + n(x.vent) + ' km/h)'); }
        else if (x.vent >= P.ventFort) { s -= 1; r.push('Vent fort (' + n(x.vent) + ' km/h)'); }
      }
      if (x.tmax >= P.chaleurCarnassiers) { s -= 1; r.push('Chaleur (' + n(x.tmax) + ' °)'); }
    } else if (g === 'carpes') {
      var C = P.carpe;
      if (t >= C.optMini && t <= C.optMaxi) { s += 2; r.push('Température ' + n(t) + ' ° : alimentation à son maximum'); }
      else if (t > C.optMaxi && t < C.chaud) { s += 1; r.push('Température chaude (' + n(t) + ' °)'); }
      else if (t >= C.chaud) { s -= 1; r.push('Forte chaleur (' + n(t) + ' °) : stress possible'); }
      else if (t >= C.froid) { s += 1; r.push('Température fraîche (' + n(t) + ' °) : alimentation réduite'); }
      else { s -= 1; r.push('Eau probablement froide (' + n(t) + ' °) : peu d\'activité'); }
      if (x.nuit === true && t >= C.froid) { s += 1; r.push('Nuit : pic de captures observé chez la carpe'); }
    } else {
      var A = P.autres;
      var ok = t >= A.mini && t <= A.maxi;
      r.push(ok ? 'Température correcte (' + n(t) + ' °)' : 'Température peu favorable (' + n(t) + ' °)');
      return { niveau: ok ? 2 : 1, pts: ok ? 1 : 0, score: P.echelle.base + (ok ? P.echelle.pas : 0), raisons: r };
    }
    return { niveau: s >= P.seuils.bon ? 3 : (s >= P.seuils.moyen ? 2 : 1), pts: s, score: Math.max(5, Math.min(95, P.echelle.base + P.echelle.pas * s)), raisons: r };
  }

  function ctxMaintenant(M) {
    var hh = M.hh, k, somme = 0, nb = 0;
    for (k = Math.max(0, M.i - 24); k <= M.i; k++) {
      if (hh.temperature_2m[k] !== null) { somme += hh.temperature_2m[k]; nb++; }
    }
    var now = mins(M.c.time), lev = mins(M.j.sunrise[1]), cou = mins(M.j.sunset[1]);
    return {
      nuages: M.c.cloud_cover, vent: M.c.wind_speed_10m,
      temp: nb ? somme / nb : M.c.temperature_2m, tmax: M.c.temperature_2m,
      nuit: M.c.is_day === 0,
      aubeCrep: Math.abs(now - lev) <= 90 || Math.abs(now - cou) <= 90
    };
  }
  function ctxJour(j, m) {
    var ens = j.sunshine_duration[m], jour = j.daylight_duration[m];
    return {
      nuages: (ens !== null && jour) ? Math.round(100 * (1 - ens / jour)) : null,
      vent: j.wind_speed_10m_max[m],
      temp: (j.temperature_2m_min[m] + j.temperature_2m_max[m]) / 2, tmax: j.temperature_2m_max[m],
      nuit: null, aubeCrep: null
    };
  }

  function ctxHeure(M, k) {
    var hh = M.hh, j = M.j, somme = 0, nb = 0, q;
    for (q = Math.max(0, k - 24); q <= k; q++) { if (hh.temperature_2m[q] !== null) { somme += hh.temperature_2m[q]; nb++; } }
    var dj = j.time.indexOf(hh.time[k].slice(0, 10)); if (dj < 0) dj = 1;
    var now = mins(hh.time[k]), lev = mins(j.sunrise[dj]), cou = mins(j.sunset[dj]);
    return {
      nuages: hh.cloud_cover[k], vent: hh.wind_speed_10m[k],
      temp: nb ? somme / nb : hh.temperature_2m[k], tmax: hh.temperature_2m[k],
      nuit: hh.is_day[k] === 0,
      aubeCrep: Math.abs(now - lev) <= 90 || Math.abs(now - cou) <= 90
    };
  }
  function barres(vals, etiq, max, classes) {
    var h = '<div class="barres">';
    vals.forEach(function (v, k) {
      var p = max ? Math.max(2, Math.round(100 * (v || 0) / max)) : 2;
      h += '<div class="bc"><div class="bz"><div class="b ' + (classes ? classes[k] : '') + '" style="height:' + p + '%" title="' + n(v, 1) + '"></div></div><span>' + (k % 3 === 0 ? etiq[k] : '') + '</span></div>';
    });
    return h + '</div>';
  }
  function hhmm(k) { return ('0' + k).slice(-2) + ':00'; }

  // ── Lune (calcul astronomique simple, sans donnée externe) ───────────────
  function lune(d) {
    var SYN = 29.530588853, jd = d.getTime() / 86400000 + 2440587.5;
    var age = (((jd - 2451550.1) % SYN) + SYN) % SYN;
    var ill = (1 - Math.cos(2 * Math.PI * age / SYN)) / 2;
    var ph = Math.floor(age / SYN * 8 + 0.5) % 8;
    var noms = ['Nouvelle lune', 'Premier croissant', 'Premier quartier', 'Gibbeuse croissante', 'Pleine lune', 'Gibbeuse décroissante', 'Dernier quartier', 'Dernier croissant'];
    var croissante = age < SYN / 2;
    var jPleine = (SYN / 2 - age + SYN) % SYN;
    var jNouvelle = (SYN - age) % SYN;
    function dans(j) { var t = new Date(d.getTime() + j * 86400000); return t.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) + ' (dans ' + Math.round(j) + ' j)'; }
    return {
      age: age, ill: Math.round(ill * 100), nom: noms[ph],
      icone: ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'][ph],
      sens: croissante ? 'croissante' : 'décroissante',
      pleine: dans(jPleine), nouvelle: dans(jNouvelle)
    };
  }
  // ── Fond d'écran selon le temps ──────────────────────────────────────────
  function appliquerFond(code, jour) {
    var f = 'jour';
    if (code >= 95) f = 'orage';
    else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) f = 'pluie';
    else if (code >= 71 && code <= 77) f = 'neige';
    else if (code === 45 || code === 48) f = 'brouillard';
    else if (code === 2 || code === 3) f = 'nuageux';
    if (jour === 0 && f === 'jour') f = 'nuit';
    if (jour === 0 && f === 'nuageux') f = 'nuit-nuageux';
    $('fond-meteo').setAttribute('data-fond', f);
  }

  // ── Détails : vent, pluie, UV, lune ──────────────────────────────────────
  function dessinerDetails() {
    var M = METEO, zone = $('details');
    if (!M || !zone) return;
    var hh = M.hh, i = M.i, idx = [], k;
    for (k = i; k < Math.min(i + 24, hh.time.length); k++) idx.push(k);
    function col(nom) { return idx.map(function (q) { return hh[nom][q]; }); }
    function maxi(a) { return Math.max.apply(null, a.map(function (v) { return v || 0; })); }
    var et = idx.map(function (q) { return hh.time[q].slice(11, 13); });
    var vent = col('wind_speed_10m'), raf = col('wind_gusts_10m'), pluie = col('precipitation'), uv = col('uv_index'), risque = col('precipitation_probability');
    var tot = 0, prochaine = -1;
    pluie.forEach(function (v, q) { tot += v || 0; if (prochaine < 0 && (v || 0) >= 0.1) prochaine = q; });
    var pic = maxi(uv), hpic = uv.indexOf(pic);
    var niveauUV = pic < 3 ? 'faible' : pic < 6 ? 'modéré' : pic < 8 ? 'élevé' : pic < 11 ? 'très élevé' : 'extrême';
    var lu = lune(new Date());
    zone.innerHTML = '<div class="panneau"><h3>Vent · 24 h (km/h)</h3>' + barres(vent, et, Math.max(10, maxi(raf)))
      + l('Maintenant', n(vent[0]) + ' km/h ' + boussole(hh.wind_direction_10m[i]))
      + l('Rafale max', n(maxi(raf)) + ' km/h') + '</div>'
      + '<div class="panneau"><h3>Pluie · 24 h (mm)</h3>' + barres(pluie, et, Math.max(1, maxi(pluie)))
      + l('Total', n(tot, 1) + ' mm')
      + l('Prochaine pluie', prochaine < 0 ? 'aucune sur 24 h' : (prochaine === 0 ? 'en cours' : 'dans ' + prochaine + ' h'))
      + l('Risque max', n(maxi(risque)) + ' %') + '</div>'
      + '<div class="panneau"><h3>UV · 24 h</h3>' + barres(uv, et, Math.max(8, pic))
      + l('Pic', pic > 0 ? n(pic, 1) + ' à ' + et[hpic] + ' h' : 'nul')
      + l('Niveau', pic > 0 ? niveauUV : 'nul') + '</div>'
      + '<div class="panneau"><h3>Lune</h3><div class="gros">' + lu.icone + ' ' + lu.ill + '<small>% éclairée</small></div>'
      + '<div class="sous">' + lu.nom + '</div>'
      + l('Phase', lu.sens)
      + l('Âge', n(lu.age, 1) + ' jours sur 29,5')
      + l('Prochaine pleine lune', lu.pleine)
      + l('Prochaine nouvelle lune', lu.nouvelle)
      + l('Rôle', 'information seulement') + '</div>';
  }

  function dessinerPeche() {
    var zone = $('peche-contenu');
    if (!METEO || !zone) return;
    Array.prototype.forEach.call(document.querySelectorAll('.peche-tete button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-g') === groupePeche ? 'true' : 'false');
    });
    var hh = METEO.hh, i = METEO.i, k, sc = [], et = [];
    var rep = evaluerPeche(groupePeche, ctxMaintenant(METEO));
    for (k = i; k < Math.min(i + 24, hh.time.length); k++) {
      sc.push(evaluerPeche(groupePeche, ctxHeure(METEO, k)));
      et.push(hh.time[k].slice(11, 13));
    }
    var vals = sc.map(function (r) { return r.score; });
    var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
    var fen = 'Aucun créneau ne se démarque sur 24 h';
    if (mx > mn) {
      var a = -1, b = -1;
      for (k = 0; k < vals.length; k++) { if (vals[k] === mx) { if (a < 0) a = k; b = k; } else if (a >= 0) break; }
      fen = 'Meilleure fenêtre : ' + hhmm(Number(et[a])) + ' – ' + hhmm((Number(et[b]) + 1) % 24);
    }
    var html = '<div class="verdict n' + rep.niveau + '">' + poissons(rep.niveau)
      + '<span class="score">' + rep.score + '<small>/100</small></span><span>' + LIBELLES[rep.niveau] + '</span></div>'
      + '<div class="sous" style="margin-top:8px">Maintenant · indice maison · ' + FIABILITE[groupePeche] + '</div>'
      + '<div class="l"><span>' + fen + '</span></div>'
      + '<div class="sous" style="margin-top:10px">Score heure par heure (24 h)</div>'
      + barres(vals, et, 100, sc.map(function (r) { return 'n' + r.niveau; }));
    rep.raisons.forEach(function (t) { html += '<div class="l"><span>' + esc(t) + '</span></div>'; });
    html += '<details><summary>Sources et limites</summary><p>Ce score est un indice que nous calculons nous-mêmes, pas une mesure scientifique. Il part de 50 et ajoute ou retire 15 points par critère retenu : l\'échelle est un choix arbitraire, seuls des écarts nets (par exemple 80 contre 50) ont un sens. Critères : lumière, vent et chaleur pour les carnassiers (étude Shaw et al. 2021, PLOS ONE, doré et maskinongé, un lac du Wisconsin, et article de Carnassiers.com) ; température et nuit pour les carpes (études de laboratoire, captures en compétition) ; température seule pour les blancs et les autres (peu de données). La pression et la lune n\'entrent pas dans le score : aucun effet démontré n\'a été retenu. La température est celle de l\'air (moyenne des dernières 24 h), pas celle de l\'eau. Les 7 jours ne tiennent pas compte de l\'heure.</p></details>';
    zone.innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.pj'), function (el) {
      var r = evaluerPeche(groupePeche, ctxJour(METEO.j, Number(el.getAttribute('data-m'))));
      el.innerHTML = poissons(r.niveau);
      el.title = LIBELLES[r.niveau] + ' (' + r.score + '/100)';
    });
  }

  // ── État ──────────────────────────────────────────────────────────────────
  var POS = null;
  var tous = [];
  var PAGE = 20, affiches = PAGE;
  var carte = null, couche = null, ongletActif = 'meteo', chargeOk = false;

  function sansNom(p) { return !p.nom || p.nom === 'Sans nom'; }
  function libelleType(t) { return t === 'peche' ? '🎣 Pêche' : '💧 Plan d\'eau'; }
  function normType(t) { return (t === 'peche' || String(t).indexOf('Pêche') >= 0) ? 'peche' : 'plan_eau'; }
  function lienGM(p) { return 'https://www.google.com/maps/search/?api=1&query=' + p.lat + ',' + p.lng; }

  // ── Filtres communs ───────────────────────────────────────────────────────
  function filtrer() {
    var masquer = $('f-nom').checked;
    var type = $('f-type').value;
    var dist = Number($('f-dist').value);
    var q = $('f-q').value.trim().toLowerCase();
    var src = $('f-src').value;
    return tous.filter(function (p) {
      if (masquer && sansNom(p)) return false;
      if (type && p.type !== type) return false;
      if (src && p.src !== src) return false;
      if (dist && p.km > dist) return false;
      if (q && (p.nom || '').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function dessinerListe(tab) {
    var html = '<div class="liste">';
    tab.slice(0, affiches).forEach(function (p) {
      html += '<a class="poi" href="' + lienGM(p) + '" target="_blank" rel="noopener">'
        + '<div><div class="nom">' + esc(sansNom(p) ? 'Sans nom' : p.nom) + '</div>'
        + '<div class="type">' + libelleType(p.type) + (p.src === 'manuel' ? ' · ⭐ manuel' : '') + '</div></div>'
        + '<div class="km">' + n(p.km, 1) + ' km</div></a>';
    });
    html += '</div>';
    if (tab.length > affiches) html += '<button class="plus" id="plus" type="button">Afficher plus (' + (tab.length - affiches) + ')</button>';
    $('liste-lacs').innerHTML = tab.length ? html : '<div class="etat">Aucun point avec ces filtres.</div>';
    var b = $('plus');
    if (b) b.addEventListener('click', function () { affiches += PAGE; dessinerListe(tab); });
  }

  function dessinerCarte(tab, recentrer) {
    if (!carte) return;
    couche.clearLayers();
    tab.forEach(function (p) {
      var m = L.circleMarker([p.lat, p.lng], {
        radius: 7, weight: 2, fillOpacity: 0.85,
        color: p.type === 'peche' ? '#e0813a' : '#3b8fd9',
        fillColor: p.type === 'peche' ? '#e0813a' : '#3b8fd9'
      });
      m.bindPopup('<div class="pop"><div class="nom">' + esc(sansNom(p) ? 'Sans nom' : p.nom) + '</div>'
        + '<div class="info">' + libelleType(p.type) + ' · ' + n(p.km, 1) + ' km</div>'
        + '<a class="gm" href="' + lienGM(p) + '" target="_blank" rel="noopener">Ouvrir dans Google Maps</a></div>');
      couche.addLayer(m);
    });
    if (recentrer && POS) {
      var d = Number($('f-dist').value);
      var zoom = !d ? 9 : d <= 10 ? 12 : d <= 25 ? 10 : d <= 50 ? 9 : d <= 100 ? 8 : 7;
      carte.setView([POS.lat, POS.lng], zoom);
    }
  }

  function initCarte() {
    if (carte || !POS) return;
    carte = L.map('carte').setView([POS.lat, POS.lng], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18, attribution: '© OpenStreetMap'
    }).addTo(carte);
    couche = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
    carte.addLayer(couche);
    L.circleMarker([POS.lat, POS.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#d33', fillOpacity: 1 })
      .addTo(carte).bindTooltip('Toi');
  }

  function majVues(recentrer) {
    if (!chargeOk) return;
    var tab = filtrer();
    $('compte').textContent = tab.length + ' point' + (tab.length > 1 ? 's' : '');
    if (ongletActif === 'liste') dessinerListe(tab);
    if (ongletActif === 'carte') { initCarte(); carte.invalidateSize(); dessinerCarte(tab, recentrer); }
  }

  // ── Onglets ───────────────────────────────────────────────────────────────
  function ouvrir(nom) {
    ongletActif = nom;
    Array.prototype.forEach.call(document.querySelectorAll('.onglets button'), function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-tab') === nom ? 'true' : 'false');
    });
    $('tab-meteo').hidden = nom !== 'meteo';
    $('tab-carte').hidden = nom !== 'carte';
    $('tab-liste').hidden = nom !== 'liste';

  }
  Array.prototype.forEach.call(document.querySelectorAll('.onglets button'), function (b) {
    b.addEventListener('click', function () { ouvrir(b.getAttribute('data-tab')); });
  });
    ['f-nom', 'f-type', 'f-src'].forEach (function (id) {
    $(id).addEventListener('change', function () { affiches = PAGE; majVues(false); });
  });
  $('f-dist').addEventListener('change', function () { affiches = PAGE; majVues(true); });

  // ── Chargement des points (lacs.json) ─────────────────────────────────────
  function chargerLacs() {
    fetch('lacs.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error('lacs.json : HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        tous = (d.lacs || []).map(function (r) {
        return { id: r[0], nom: r[1], type: normType(r[2]), src: r[5] || 'auto', lat: r[3], lng: r[4], km: distKm(POS.lat, POS.lng, r[3], r[4]) };        }).sort(function (a, b) { return a.km - b.km; });
        var maj = d.maj ? new Date(d.maj).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : '';
        $('maj-lacs').textContent = maj ? 'Liste mise à jour le ' + maj : '';

  // ── Météo ─────────────────────────────────────────────────────────────────
  function chargerMeteo(lat, lng) {
    var app = $('meteo');
    app.innerHTML = '<div class="etat">Chargement météo…</div>';
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat + '&longitude=' + lng
      + '&current=is_day,temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m'
      + '&hourly=is_day,uv_index,temperature_2m,precipitation_probability,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset,uv_index_max,sunshine_duration,daylight_duration'
      + '&past_days=1&forecast_days=7&timezone=auto';

    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        var c = d.current, hh = d.hourly, j = d.daily, i = 0;
        for (var k = 0; k < hh.time.length; k++) {
          if (hh.time[k].slice(0, 13) === c.time.slice(0, 13)) { i = k; break; }
        }
        var d3 = i >= 3 ? hh.pressure_msl[i] - hh.pressure_msl[i - 3] : null;
        var d6 = i >= 6 ? hh.pressure_msl[i] - hh.pressure_msl[i - 6] : null;
        var t3 = tendance(d3), t6 = tendance(d6);
        var html = '';

        // j[1] = aujourd'hui (la requête inclut past_days=1)
        html += '<section><div class="panneaux">'
          // Ciel
          + '<div class="panneau"><h3>Ciel</h3>'
          + '<div class="gros">' + n(c.temperature_2m, 1) + '°</div>'
          + '<div class="sous">' + ciel(c.weather_code, c.is_day) + ' · ressenti ' + n(c.apparent_temperature, 1) + '°</div>'
          + l('Nuages', n(c.cloud_cover) + ' %')
          + l('Soleil aujourd\'hui', n(heures(j.sunshine_duration[1]), 1) + ' h sur ' + n(heures(j.daylight_duration[1]), 1) + ' h')
          + l('Lever / coucher', h(j.sunrise[1]) + ' / ' + h(j.sunset[1]))
          + '</div>'
          // Vent et pluie
          + '<div class="panneau"><h3>Vent et pluie</h3>'
          + '<div class="gros">' + n(c.wind_speed_10m) + '<small>km/h ' + boussole(c.wind_direction_10m) + '</small></div>'
          + '<div class="sous">vent actuel</div>'
          + l('Rafales', n(c.wind_gusts_10m) + ' km/h')
          + l('Pluie actuelle', n(c.precipitation, 1) + ' mm')
          + l('Humidité', n(c.relative_humidity_2m) + ' %')
          + l('Visibilité', hh.visibility[i] !== null ? n(hh.visibility[i] / 1000, 1) + ' km' : '–')
          + '</div>'
          // Pression
          + '<div class="panneau"><h3>Pression (pêche)</h3>'
          + '<div class="gros">' + n(c.pressure_msl) + '<small>hPa</small></div>'
          + '<div class="sous"><span class="' + t3[1] + '">' + t3[0] + '</span></div>'
          + l('Tendance 3 h', signe(d3) + ' hPa', t3[1])
          + l('Tendance 6 h', signe(d6) + ' hPa', t6[1])
          + '</div>'
          + '</div></section>';

        html += '<section><h2 class="bloc">Pêche <small>indicatif</small></h2>'
          + '<div class="peche-tete">' + Object.keys(GROUPES).map(function (g) {
              return '<button type="button" data-g="' + g + '" aria-pressed="false">' + GROUPES[g] + '</button>';
            }).join('') + '</div>'
          + '<div class="peche-corps" id="peche-contenu"></div></section>';
        html += '<section><h2 class="bloc">Détails</h2><div class="details" id="details"></div></section>';

        // 24 h : frise horizontale
        html += '<section><h2 class="bloc">Prochaines 24 h</h2><div class="heures">';
        for (var a = i; a < Math.min(i + 25, hh.time.length); a++) {
          var risque = hh.precipitation_probability[a], raf = hh.wind_gusts_10m[a];
          html += '<div class="heure' + (a === i ? ' now' : '') + '">'
            + '<div class="t">' + h(hh.time[a]) + '</div>'
            + '<div class="temp">' + n(hh.temperature_2m[a]) + '°</div>'
            + '<div class="m"><span class="' + (risque >= 50 ? 'alerte' : '') + '">' + n(hh.precipitation[a], 1) + ' mm</span><div class="d">risque ' + n(risque) + '%</div></div>'
            + '<div class="m">' + n(hh.wind_speed_10m[a]) + ' ' + boussole(hh.wind_direction_10m[a]) + '<div class="d ' + (raf >= 50 ? 'alerte' : '') + '">raf. ' + n(raf) + '</div></div>'
            + '<div class="m">' + n(hh.pressure_msl[a]) + '<div class="d">hPa</div></div>'
            + '<div class="m">' + n(hh.cloud_cover[a]) + '%<div class="d">nuages</div></div>'
            + '</div>';
        }
        html += '</div></section>';

        // 7 jours : une carte par jour
        html += '<section><h2 class="bloc">7 jours</h2><div class="jours">';
        for (var m = 1; m < j.time.length; m++) {
          var rj = j.precipitation_probability_max[m], gj = j.wind_gusts_10m_max[m];
          html += '<div class="jour">'
            + '<div class="nom">' + jourFr(j.time[m]) + '</div>'
            + '<div class="ciel">' + (CODES[j.weather_code[m]] || '–') + '</div>'
            + '<div class="minmax">' + n(j.temperature_2m_min[m]) + '° <small>/</small> ' + n(j.temperature_2m_max[m]) + '°</div>'
            + l('Pluie', n(j.precipitation_sum[m], 1) + ' mm · ' + n(rj) + '%', rj >= 50 ? 'alerte' : '')
            + l('Vent', n(j.wind_speed_10m_max[m]) + ' km/h')
            + l('Rafales', n(gj) + ' km/h', gj >= 50 ? 'alerte' : '')
            + l('Soleil', n(heures(j.sunshine_duration[m]), 1) + ' h')
            + l('Lever / coucher', h(j.sunrise[m]) + ' / ' + h(j.sunset[m]))
            + l('UV', n(j.uv_index_max[m], 1))
            + '<div class="l"><span>Pêche</span><span class="pj" data-m="' + m + '"></span></div>'
            + '</div>';
        }
        html += '</div></section>';

        app.innerHTML = html;
        METEO = { c: c, hh: hh, j: j, i: i };
        dessinerDetails();
        appliquerFond(c.weather_code, c.is_day);
        Array.prototype.forEach.call(document.querySelectorAll('.peche-tete button'), function (b) {
          b.addEventListener('click', function () {
            groupePeche = b.getAttribute('data-g');
            try { localStorage.setItem('groupePeche', groupePeche); } catch (e) {}
            dessinerPeche();
          });
        });
        dessinerPeche();
      })
      .catch(function (e) {
        app.innerHTML = '';
        erreur('Météo indisponible : ' + e.message);
      });
  }

  // ── Démarrage ─────────────────────────────────────────────────────────────
  function demarrer(lat, lng) {
    POS = { lat: lat, lng: lng };
    var pos = $('pos');
    pos.textContent = lat.toFixed(4) + ', ' + lng.toFixed(4);
    pos.className = 'pos';
    chargerMeteo(lat, lng);
    chargerLacs();
  }

  if (!navigator.geolocation) {
    erreur('Géolocalisation indisponible sur cet appareil. Position par défaut : Namur.');
    demarrer(50.4669, 4.8674);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    function (p) {
      demarrer(p.coords.latitude, p.coords.longitude);
      if (p.coords.accuracy > 5000) {
        var b = $('pos');
        b.textContent += ' · ±' + Math.round(p.coords.accuracy / 1000) + ' km';
        b.className = 'pos warn';
      }
    },
    function () {
      erreur('Position refusée. Position par défaut : Namur.');
      demarrer(50.4669, 4.8674);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
})();
</script>

<style>

  #poissons-mois .pm-carte:hover { border-color: var(--accent-trait); background: var(--carte-hover); }
  #poissons-mois .pm-carte[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-fond); }

  #poissons-mois .pm-sci { font: italic 400 11px var(--mono); color: var(--discret); }
  #poissons-mois .pm-tag { margin-top: 4px; font: 400 10px var(--mono); color: var(--discret); }
  #poissons-mois .pm-tag.alerte { color: var(--accent); }
  #poissons-mois .pm-detail { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 14px 16px; margin-top: 4px; }
  #poissons-mois .pm-detail h3 { font: 600 18px var(--serif); }
  #poissons-mois .pm-an { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin: 10px 0; }

  #poissons-mois .pm-an span.on { background: var(--accent-trait); color: var(--papier); }
  #poissons-mois .pm-an span.now { outline: 1.5px solid var(--accent); }
  #poissons-mois .pm-ligne-info { font: 400 12px var(--mono); color: var(--discret); padding: 3px 0; }

.heures::-webkit-scrollbar, #poissons-mois .pm-ligne::-webkit-scrollbar { display: none; }
</style>
<script>
(function () {
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var MOIS_C = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
  var GROUPES = { tous: 'Tous', carnassiers: 'Carnassiers', carpes: 'Carpes', blancs: 'Blancs', autres: 'Autres' };
  var LIEN_REGLES = 'https://environnement.wallonie.be/';

  var hote = document.getElementById('tab-meteo');
  if (!hote) return;
  var sec = document.createElement('section');
  sec.id = 'poissons-mois';
  sec.innerHTML = '<div class="etat">Chargement des espèces…</div>';
  hote.appendChild(sec);

  var mois = new Date().getMonth(), moisNow = mois, groupe = 'tous', choisi = null, liste = [];

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // r = [nom, scientifique, groupe, "010101010101", fermeture légale, remarque, source]
  function statut(r) { var m = /Statut : ([^.]*)\./.exec(r[5] || ''); return m ? m[1] : ''; }
  function rang(r) { var s = statut(r).toLowerCase(); return s.indexOf('commune') === 0 ? 0 : (s.indexOf('indigène') === 0 ? 1 : 2); }
  function alerte(r) { return (r[5] || '').indexOf('Vérifier impérativement') >= 0; }

  function especesDuMois() {
    return liste.filter(function (r) {
      return r[3].charAt(mois) === '1' && (groupe === 'tous' || r[2] === groupe);
    }).sort(function (a, b) { return rang(a) - rang(b) || a[0].localeCompare(b[0], 'fr'); });
  }
  function detail(r) {
    var an = '';
    for (var k = 0; k < 12; k++) {
      an += '<span class="' + (r[3].charAt(k) === '1' ? 'on' : '') + (k === moisNow ? ' now' : '') + '" title="' + MOIS[k] + '">' + MOIS_C[k] + '</span>';
    }
    var note = (r[5] || '').replace(/^Statut : [^.]*\.\s*/, '');
    var liens = '<a href="' + LIEN_REGLES + '" target="_blank" rel="noopener">Réglementation (Wallonie)</a>';
    if (/^https:\/\//.test(r[6] || '')) liens += ' · <a href="' + esc(r[6]) + '" target="_blank" rel="noopener">Fiche FishBase</a>';
    return '<div class="pm-detail"><h3>' + esc(r[0]) + '</h3><div class="pm-sci">' + esc(r[1]) + '</div>'
      + '<div class="pm-an">' + an + '</div>'
      + '<div class="pm-ligne-info">Groupe : ' + esc(r[2]) + (statut(r) ? ' · ' + esc(statut(r)) : '') + '</div>'
      + (note ? '<div class="pm-ligne-info">' + esc(note) + '</div>' : '')
      + '<div class="pm-ligne-info">Fermeture légale : ' + esc(r[4] || 'à vérifier') + '</div>'
      + (alerte(r) ? '<div class="pm-ligne-info alerte" style="color:var(--accent)">⚠ Vérifie impérativement les interdictions de capture et de détention.</div>' : '')
      + '<div class="pm-ligne-info">' + liens + '</div></div>';
  }
  function dessiner() {
    var tab = especesDuMois();
    var html = '<div class="pm-tete"><button type="button" class="pm-nav" data-act="prec" aria-label="Mois précédent">‹</button>'
      + '<div class="pm-titre">À pêcher en ' + MOIS[mois] + ' <span class="pm-sci">· ' + tab.length + ' espèce' + (tab.length > 1 ? 's' : '') + '</span></div>'
      + '<button type="button" class="pm-nav" data-act="suiv" aria-label="Mois suivant">›</button></div>'
      + '<div class="pm-chips">' + Object.keys(GROUPES).map(function (g) {
          return '<button type="button" class="pm-chip" data-g="' + g + '" aria-pressed="' + (g === groupe) + '">' + GROUPES[g] + '</button>';
        }).join('') + '</div>';
    if (!tab.length) {
      html += '<div class="etat">Aucune espèce listée ce mois-ci pour ce groupe.</div>';
    } else {
      html += '<div class="pm-ligne">' + tab.map(function (r) {
        var i = liste.indexOf(r);
        var tag = alerte(r) ? '⚠ à vérifier' : statut(r);
        return '<button type="button" class="pm-carte" data-i="' + i + '" aria-pressed="' + (choisi === i) + '">'
          + '<span class="pm-ico">🐟</span><span class="pm-nom">' + esc(r[0]) + '</span><span class="pm-sci">' + esc(r[1]) + '</span>'
          + (tag ? '<span class="pm-tag' + (alerte(r) ? ' alerte' : '') + '">' + esc(tag) + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    }
    if (choisi !== null && liste[choisi]) html += detail(liste[choisi]);
    html += '<p class="pm-avert">Saison biologique indicative, pas une autorisation de pêche. Vérifie les fermetures, tailles minimales et règles de ton cours d\'eau avant de partir.</p>';
    sec.innerHTML = html;
  }
  sec.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    if (b.getAttribute('data-act') === 'prec') { mois = (mois + 11) % 12; choisi = null; }
    else if (b.getAttribute('data-act') === 'suiv') { mois = (mois + 1) % 12; choisi = null; }
    else if (b.getAttribute('data-g')) { groupe = b.getAttribute('data-g'); choisi = null; }
    else if (b.getAttribute('data-i') !== null) { var i = Number(b.getAttribute('data-i')); choisi = (choisi === i) ? null : i; }
    else return;
    dessiner();
  });
  fetch('poissons.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) { liste = d.especes || []; dessiner(); })
    .catch(function (e) {
      sec.innerHTML = '<div class="etat">Liste des espèces indisponible (poissons.json : ' + esc(e.message) + ').</div>';
    });
})();
</script>
