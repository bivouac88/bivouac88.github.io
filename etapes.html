<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Étapes · Bivouac88</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#e58e26">
    <script src="commun.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    .bouton-theme svg { width: 17px; height: 17px; display: block; }
    #journal {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}
    .etape {
      background: var(--carte);
      border: 1px solid var(--trait);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .etape.fait { border-color: var(--accent-trait); }
    .etape-entete {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    .etape .jour {
      font: 500 11px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--discret);
    }
    .etape.fait .jour { color: var(--accent); }
    .etape .badge {
      font: 400 11px var(--mono);
      color: var(--discret-sombre);
    }
    .etape.fait .badge { color: var(--accent); font-weight: 500; }
    .etape .trajet {
      font-size: clamp(17px, 2.4vw, 20px);
      font-weight: 600;
      margin: 4px 0 6px;
    }
    .etape .trajet i { color: var(--accent); font-style: normal; font-family: var(--mono); font-weight: 400; padding: 0 4px; }
    .etape .meta {
      font: 400 13px var(--mono);
      color: var(--discret);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
    }
    .etape .meta span.sep { color: var(--trait-actif); }

    .avis-bloc {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--trait-subtil);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .avis-smiley { font-size: 28px; line-height: 1; flex-shrink: 0; }
    .avis-texte { flex: 1; min-width: 0; }
    .avis-commentaire { color: var(--papier); font-size: 14px; line-height: 1.5; }
      .avis-photo {
      margin-top: 10px;
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid var(--trait);
      display: block;
    }
    .galerie-photos {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
}
.galerie-photos .avis-photo {
  width: 100%;
  height: 60px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid var(--trait);
  transition: opacity 0.15s ease;
}
.galerie-photos .avis-photo:hover {
  opacity: 0.8;
}
    .lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,0.85);
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
.lightbox.active {
  display: flex;
}
.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 10px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
  .comments-bloc {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--trait-subtil);
}
.comment-form {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.comment-form button {
  width: 100%;
}
.comment-form input[placeholder="Ton nom"] {
  max-width: 120px;
}
.comments-list {
  max-width: 500px;
}
.comment-form input {
  flex: 1;
  background: var(--fond);
  border: 1px solid var(--trait);
  border-radius: 8px;
  padding: 7px 10px;
  color: var(--papier);
  font: 13px var(--mono);
}
.comment-form button {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 7px 14px;
  font: 500 12px var(--mono);
  cursor: pointer;
}
.comment {
  font: 13px var(--mono);
  color: var(--discret);
  padding: 6px 0;
  border-bottom: 1px solid var(--trait-subtil);
}
.comment strong { color: var(--papier); }

.comments-inline {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.comments-inline .comments-list {
  flex: 1;
}
.comments-more {
  font: 500 13px var(--mono);
  color: var(--discret);
  text-decoration: none;
  padding: 4px 8px;
  border: 1px solid var(--trait);
  border-radius: 6px;
  white-space: nowrap;
  align-self: center;
}
.comments-more:hover { color: var(--accent); border-color: var(--accent-trait); }
.avis-bloc {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: flex-start;
}
.comments-side {
  border-left: 1px solid var(--trait-subtil);
  padding-left: 14px;
}
    .like-bloc {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font: 500 12px var(--mono);
}
.like-btn {
  background: none;
  border: 1px solid var(--trait);
  border-radius: 6px;
  padding: 4px 10px;
  color: var(--discret);
  cursor: pointer;
  font: 500 12px var(--mono);
  transition: color 0.15s, border-color 0.15s;
}
.like-btn.vote {
  color: var(--accent);
  border-color: var(--accent-trait);
}
</style>
</head>
<body>
<main>
  <button id="btn-theme" class="bouton-theme" type="button" aria-label="Thème" title="Thème"></button>

  <div class="ligne-haut">
    <div class="marque">
      <a class="logo" href="index.html">
        <img src="apple-touch-icon.png" alt="" width="36" height="36">
        <span>Bivouac<em>88</em></span>
      </a>
      <a class="pastille" href="https://www.leetchi.com/fr/c/bivouac88-4670104" target="_blank" rel="noopener">Soutenir</a>
    </div>
    <a class="retour" href="index.html">← Retour</a>
  </div>

  <h1 class="titre-page">Toutes les étapes</h1>
  <p class="sous-titre-page" id="compteur-page">chargement…</p>

  <div id="erreur"></div>
  <ol id="journal"></ol>
<div id="lightbox" class="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>
</main>
<script>
  // ---- Données ----
  var API = 'https://script.google.com/macros/s/AKfycbyptX2-OXsxh8yXqk9Hi_ygvcxP1_4vD0AT-KzZPcTFzR9AfEKHbQnBvgi3Pvw5a-LL/exec';
  var $ = function (id) { return document.getElementById(id); };
  var fmtDec = function (n, d) {
    return Number(n || 0).toLocaleString('fr-FR', { minimumFractionDigits: d !== undefined ? d : 1, maximumFractionDigits: d !== undefined ? d : 1 });
  };
  var fmt = function (n) { return Number(n || 0).toLocaleString('fr-FR'); };
  var toutesEtapes = [];
  var SMILEYS = { '1': '😞', '2': '🙁', '3': '😐', '4': '🙂', '5': '😍' };
  function smileyPour(avis) {
    if (!avis) return '';
    var a = String(avis).trim();
    if (SMILEYS[a]) return SMILEYS[a];
    // Si l'avis est déjà un emoji ou un texte, on l'affiche tel quel
    return a;
  }

  function afficherJournal(etapes, tout) {
    var ol = $('journal');
    ol.innerHTML = '';
    $('compteur-page').textContent = etapes.length + ' étapes au total';

    (tout ? etapes : etapes.slice(0, 6)).forEach(function (e) {
      var li = document.createElement('li');
      var classe = 'etape';
      if (e.fait) classe += ' fait';
      li.className = classe;

      var badgeText = e.fait ? 'Faite' : 'À venir';

      var html =
        '<div class="etape-entete">' +
          '<span class="jour">Étape ' + e.jour + '</span>' +
          '<span class="badge">' + badgeText + '</span>' +
        '</div>' +
        '<div class="trajet"><span>' + e.depart + '</span><i>→</i><span>' + e.arrivee + '</span></div>' +
        '<div class="meta">' +
          '<span>' + fmtDec(e.km, 1) + ' km</span>' +
          '<span class="sep">·</span>' +
          '<span>+' + fmt(e.denivele) + ' m</span>' +
          '<span class="sep">·</span>' +
          '<span>' + (e.temps || '–') + '</span>' +
        '</div>';

      if (e.fait && e.note && (e.note.avis || e.note.commentaire || e.note.photo)) {
        html += '<div class="avis-bloc">';
        if (e.note.avis) {
        html += '<div class="avis-smiley">' + smileyPour(e.note.avis) + '</div>';
        }
        html += '<div class="avis-texte">';
        if (e.note.commentaire) {
          html += '<div class="avis-commentaire">' + e.note.commentaire + '</div>';
        }
        var photos = [e.note.photo, e.note.photo2, e.note.photo3, e.note.photo4].filter(Boolean);
if (photos.length) {
  html += '<div class="galerie-photos">';
  photos.forEach(function (url, i) {
  var miniature = url.split('=')[0] + '=w200';
  html += '<img class="avis-photo" src="' + miniature + '" alt="Photo ' + (i + 1) + '" loading="lazy" style="cursor:pointer" onclick="ouvrirLightbox(this.dataset.original)" data-original="' + url + '">';
});
  html += '</div>';
}
                if (e.fait) {
html += '<div class="comments-side">';
html += '<div class="comments-inline">';
html += '<div class="comments-list" id="comments-' + e.jour + '"></div>';
html += '<a class="comments-more" href="#">···</a>';
html += '</div>';
                  var aDejaVote = false;
try { aDejaVote = localStorage.getItem('like-' + e.jour) === '1'; } catch(e2) {}
html += '<div class="like-bloc">';
html += '<button class="like-btn' + (aDejaVote ? ' vote' : '') + '" onclick="toggleLike(' + e.jour + ', this)">👍</button>';
html += '<span id="like-count-' + e.jour + '" style="color:var(--discret)">–</span>';
html += '</div>';
html += '<div class="comment-form">';
html += '<input type="text" placeholder="Ton nom" id="nom-' + e.jour + '" maxlength="30">';
html += '<input type="text" placeholder="Ton commentaire" id="comment-' + e.jour + '">';
html += '<button onclick="postComment(' + e.jour + ')">Envoyer</button>';
html += '</div></div>';
}
        html += '</div></div>';
      }
if (false) {
html += '<div class="comments-bloc">';
}
      li.innerHTML = html;
      ol.appendChild(li);
    });
   if (!tout && etapes.length > 6) {
  var btnPlus = document.createElement('li');
  btnPlus.style.cssText = 'grid-column:1/-1;display:flex;justify-content:center;padding:8px 0;';
  btnPlus.innerHTML = '<button onclick="toutAfficher()" style="background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:10px 24px;color:var(--discret);font:500 13px var(--mono);cursor:pointer;letter-spacing:0.04em;">↓ Voir toutes les étapes</button>';
  ol.appendChild(btnPlus);
} 
  }

  fetch(API + '?public=1')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.erreur) throw new Error(d.erreur);
      toutesEtapes = d.etapes;
      afficherJournal(d.etapes);
      d.etapes.forEach(function(e) {
        if (e.fait) loadComments(e.jour);
      });
    })
    .catch(function (e) {
      var errEl = $('erreur');
      errEl.style.display = 'block';
      errEl.textContent = 'Données indisponibles : ' + e.message;
      $('compteur-page').textContent = '';
    });
function ouvrirLightbox(url) {
  var img = document.getElementById('lightbox-img');
  img.src = url.split('=')[0] + '=s1600';
  document.getElementById('lightbox').classList.add('active');
}

document.getElementById('lightbox').onclick = function() {
  this.classList.remove('active');
  document.getElementById('lightbox-img').src = '';
};
function postComment(jour) {
  var nom = document.getElementById('nom-' + jour).value;
  var comment = document.getElementById('comment-' + jour).value;
  if (!nom || !comment) return;
  fetch(API, {
    method: 'POST',
    body: JSON.stringify({ etape: jour, nom: nom, commentaire: comment })
  }).then(function() {
    document.getElementById('nom-' + jour).value = '';
    document.getElementById('comment-' + jour).value = '';
    loadComments(jour);
    var btn = document.querySelector('#comments-' + jour + ' ~ .comment-form button') || document.evaluate("//button[@onclick='postComment(" + jour + ")']", document, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue;
    var notif = document.createElement('div');
    notif.textContent = '✓ Commentaire envoyé !';
    notif.style.cssText = 'color:var(--accent);font:12px var(--mono);margin-top:6px;';
    btn.parentNode.appendChild(notif);
    setTimeout(function() { notif.remove(); }, 3000);
  });
}
  function loadComments(jour) {
  fetch(API + '?comments=' + jour)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var el = document.getElementById('comments-' + jour);
      if (!el) return;
      el.innerHTML = d.comments.map(function(c) {
        return '<div class="comment"><strong>' + c.nom + '</strong> ' + c.commentaire + '</div>';
      }).join('');
    });
}
function toutAfficher() {
  afficherJournal(toutesEtapes, true);
  toutesEtapes.forEach(function(e) { if (e.fait) loadComments(e.jour); });
}
function toggleLike(jour, btn) {
  var aVote = false;
  try { aVote = localStorage.getItem('like-' + jour) === '1'; } catch(e) {}
  if (aVote) return; // un seul vote par appareil
  try { localStorage.setItem('like-' + jour, '1'); } catch(e) {}
  btn.classList.add('vote');
  fetch(API, {
    method: 'POST',
    body: JSON.stringify({ action: 'like', etape: jour })
  }).then(function() { loadLikes(jour); });
}

function loadLikes(jour) {
  fetch(API + '?likes=' + jour)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var el = document.getElementById('like-count-' + jour);
      if (el) el.textContent = d.likes + ' 👍';
    }).catch(function() {});
}
</script>
</body>
</html>
